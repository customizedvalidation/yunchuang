# ==============================================================================
# 17-postgresql.yaml — PostgreSQL StatefulSet + Headless Service
# ==============================================================================
# 补齐此前缺失的数据库工作负载：09-networkpolicy.yaml 已放行 backend → 5432、
# 02-secret.yaml 也早已指向 postgresql.metaclouds.svc.cluster.local，但集群里
# 从来没有 postgres 这个 Pod，后端起来必连不上。
#
# ⚠️ 当前阶段说明（务必读完再改开关）
# ---------------------------------------------------------------------------
# 后端请求层仍是 **SQLite 方言**（`?N` 占位符 + `last_insert_rowid()`，
# 见 src/ 内 253 处占位符 / 276 处 SqlitePool），main.rs 在 Postgres 模式下
# 会 fail-closed 退出。因此本次交付把 Deployment 切回 SQLite + PVC 单副本
# （见 01-configmap.yaml 的 USE_SQLITE 与 19-backend-pvc.yaml），
# PostgreSQL 在这里**预先就绪**，完成方言迁移后按 01-configmap.yaml 里的
# “切到 PostgreSQL”注释三行切回即可，无需再补清单。
#
# 单副本限制：本 StatefulSet 只有 1 副本，未做流复制/高可用。生产如需 HA，
# 请换 CloudNativePG / Zalando operator 或云厂商托管实例，并同步改
# DATABASE_URL。
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: metaclouds
  labels:
    app: postgresql
    component: database
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: database
spec:
  # headless：StatefulSet 稳定 DNS（postgresql-0.postgresql.metaclouds.svc...）
  clusterIP: None
  selector:
    app: postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: metaclouds
  labels:
    app: postgresql
    component: database
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
        component: database
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/part-of: metaclouds
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        # postgres 官方镜像内的 postgres 用户 uid/gid = 999
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            # 初始化只在数据目录为空时生效；已存在数据卷时这三项被忽略，
            # 由卷内已有的角色/库为准（避免改密码后旧库反而起不来）。
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: metaclouds-backend-config
                  key: DATABASE_NAME
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: metaclouds-backend-config
                  key: DATABASE_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: postgres-password
            # 必须放在卷的子目录：PGDATA 直接指向卷根会因 lost+found 导致 initdb 失败
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # 官方镜像自带 pg_isready
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "metaclouds_user", "-d", "metaclouds"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "metaclouds_user", "-d", "metaclouds"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "metaclouds_user", "-d", "metaclouds"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
