# ==============================================================================
# 02-secret.yaml — 敏感凭据（fail-secure 模板，base64 占位）
# ==============================================================================
# ⚠️ 本文件是模板，data 中为 base64 占位值，不含任何真实密钥。
#     部署前必须通过以下方式之一注入真实值：
#
#   方式 1：kubectl create secret（推荐）
#   ---------------------------------------------------------------------------
#   kubectl -n metaclouds create secret generic metaclouds-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=database-url="postgresql://metaclouds_user:$(openssl rand -base64 24)@postgres:5432/metaclouds?sslmode=require" \
#     --from-literal=redis-password="$(openssl rand -base64 24)"
#
#   方式 2：External Secrets Operator / Sealed Secrets（生产推荐）
#   ---------------------------------------------------------------------------
#   将密钥托管在 AWS Secrets Manager / HashiCorp Vault，Git 仅存加密引用。
#
# ⚠️ 切勿将真实密钥值提交到 Git。
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: metaclouds-secrets
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    metaclouds.io/managed-by: "template"
    metaclouds.io/rotation-policy: "90d"
type: Opaque
# base64 占位值（echo -n "placeholder" | base64）
# 部署前替换为真实密钥；以下值仅为结构占位。
data:
  # jwt-secret: base64 编码的 JWT 签名密钥（≥32 字节原始数据）
  # 占位原文: "CHANGEME-jwt-secret"
  jwt-secret: Q0hBTkdFTUUtand0LXNlY3JldA==
  # database-url: base64 编码的 PostgreSQL 连接串（含密码）
  # 占位原文: "postgresql://metaclouds_user:CHANGEME@postgres:5432/metaclouds?sslmode=require"
  database-url: cG9zdGdyZXNxbDovL21ldGFjbG91ZHNfdXNlcjpDSEFOR0VNRUBwb3N0Z3Jlczo1NDMyL21ldGFjbG91ZHM/c3NsbW9kZT1yZXF1aXJl
  # redis-password: base64 编码的 Redis 密码
  # 占位原文: "CHANGEME-redis-password"
  redis-password: Q0hBTkdFTUUtcmVkaXMtcGFzc3dvcmQ=
