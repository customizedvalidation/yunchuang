# ==============================================================================
# 08-pdb.yaml — PodDisruptionBudget
# ==============================================================================
# 确保节点维护 / 集群升级期间，自愿中断（eviction）不会导致服务不可用。
#
# ✅ 已切到 PostgreSQL + 3 副本：用 minAvailable: 2 保障滚动/维护期间至少 2 个
#    后端 Pod 在线（避免自愿驱逐导致服务降级）。
# ==============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metaclouds-backend-pdb
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: metaclouds
      component: backend
