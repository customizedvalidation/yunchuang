# ==============================================================================
# 08-pdb.yaml — PodDisruptionBudget
# ==============================================================================
# 确保节点维护 / 集群升级期间，自愿中断（eviction）不会导致服务不可用。
#
# ⚠️ 当前是单副本（SQLite 单写者约束，见 19-backend-data-pvc.yaml）：
#    用 maxUnavailable 而不是 minAvailable —— minAvailable: 2 在 1 副本下
#    会把自愿驱逐全部挡死，节点 drain 直接卡住。
#    迁移到 PostgreSQL + 3 副本后改回 minAvailable: 2。
# ==============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: metaclouds-backend-pdb
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: metaclouds
      component: backend
