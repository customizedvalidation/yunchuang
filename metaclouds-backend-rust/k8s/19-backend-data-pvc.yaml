# ==============================================================================
# 19-backend-data-pvc.yaml — 后端 SQLite 数据盘
# ==============================================================================
# ⚠️ 为什么后端要用 PVC：
# 请求层当前是 SQLite 方言（详见 17-postgresql.yaml 文件头的阶段说明）。
# SQLite 需要**一个可写、可持久的文件**，而 05-deployment.yaml 是
# readOnlyRootFilesystem=true，容器内没有可写持久目录 —— 没有这块盘，
# 后端要么起不来，要么每次重启丢库。
#
# ⚠️ 单写者约束（重要）：
# SQLite 不支持多进程并发写同一文件（会 SQLITE_BUSY / 损坏）。因此
# 05-deployment.yaml 被固定为 replicas: 1 + strategy: Recreate，
# 07-hpa.yaml 固定为 1/1。迁移到 PostgreSQL 后可以删除本文件并恢复多副本。
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: metaclouds-backend-data
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
spec:
  # 单写者：必须是 ReadWriteOnce，绝不能改成 ReadWriteMany 后扩副本
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
