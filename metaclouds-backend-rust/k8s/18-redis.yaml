# ==============================================================================
# 18-redis.yaml — Redis StatefulSet + Service（会话撤销名单 / 缓存）
# ==============================================================================
# 用途：后端 `cache::build_cache()` 在 REDIS_ENABLED=true 时连接本实例，用于
# JWT `jti` 撤销名单（登出即失效，见 src/cache/session.rs）。Redis 不可用时
# 后端自动降级为 NoopCache（等令牌自然过期），不会因缓存故障而不可用。
#
# 09-networkpolicy.yaml 已放行 backend → redis:6379。
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: metaclouds
  labels:
    app: redis
    component: cache
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: metaclouds
  labels:
    app: redis
    component: cache
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: cache
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        component: cache
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: metaclouds
        app.kubernetes.io/component: cache
    spec:
      # redis 无需访问 K8s API，不自动挂载 SA token（CKV_K8S_38）
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # 钉具体 minor tag（避免 :7-alpine 浮动 minor）；imagePullPolicy 改 IfNotPresent
          # 配合固定 tag，避免每次 Pod 重建都拉浮动层。
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: redis-password
          # redis-server 不读 REDIS_PASSWORD 环境变量。
          # 为避免口令暴露在容器 `ps`（--requirepass "$(REDIS_PASSWORD)"），
          # 由 initContainer 从 Secret 生成 redis.conf（含 requirepass 指令），
          # redis-server 启动时加载该文件。文件权限 600，容器内仅 redis 用户可读。
          command:
            - redis-server
            - /etc/redis/redis.conf
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            # 根文件系统只读（CKV_K8S_22）：数据落 PVC，运行时写路径挂 emptyDir
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            exec:
              # TCP 端口可达即认为 ready（不验证 auth，避免探针在 ps 暴露口令）
              command: ["sh", "-c", "nc -z -w 2 127.0.0.1 6379"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", "nc -z -w 2 127.0.0.1 6379"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["sh", "-c", "nc -z -w 2 127.0.0.1 6379"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            # 根文件系统只读后，redis 运行时写路径挂 emptyDir
            - name: tmp
              mountPath: /tmp
            # redis.conf（initContainer 生成）+ unix socket
            - name: redis-config
              mountPath: /etc/redis
              readOnly: true
      initContainers:
        - name: gen-redis-conf
          image: redis:7.4-alpine
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: redis-password
          command:
            - /bin/sh
            - -c
            - |
              set -e
              umask 077
              cat > /etc/redis/redis.conf <<EOF
              bind 0.0.0.0
              port 6379
              dir /data
              appendonly yes
              requirepass ${REDIS_PASSWORD}
              unixsocket /etc/redis/redis.sock
              unixsocketperm 600
              protected-mode yes
              EOF
              chmod 600 /etc/redis/redis.conf
          volumeMounts:
            - name: redis-config
              mountPath: /etc/redis
      volumes:
        - name: tmp
          emptyDir: {}
        - name: redis-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
