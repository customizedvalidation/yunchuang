# ==============================================================================
# 05-deployment.yaml — 后端 Deployment（Rust）
# ==============================================================================
# Rust (axum + sqlx) 静态二进制，3 副本，滚动更新零宕机。
#
# 关键安全/稳定性配置（对齐验收标准）：
#   - 非 root：runAsNonRoot=true, runAsUser=10001
#   - readOnlyRootFilesystem=true（可写目录用 emptyDir 挂载）
#   - allowPrivilegeEscalation=false, drop ALL capabilities
#   - 三探针：startupProbe / livenessProbe / readinessProbe
#   - 资源 limits/requests：CPU 500m/250m, Memory 512Mi/256Mi
#   - topologySpreadConstraints：跨节点 + 跨可用区
#   - 滚动更新：maxSurge=1, maxUnavailable=0
#
# ⚠️ 探针路径说明：Rust 后端已新增根级 `/health` 端点（无 JWT，返回 200），
#    三探针（startup/liveness/readiness）统一使用 `/health`，与 Go 版对齐。
#    `/metrics` 仅供 Prometheus scraper 抓取。
#
# 镜像 tag 通过 CI/CD 注入：
#   kubectl set image deployment/metaclouds-backend \
#     metaclouds-backend=ghcr.io/customizedvalidation/yunchuang/backend-rust:${GIT_SHA}
#
# ⚠️ 副本数固定为 1（strategy: Recreate）：后端请求层仍是 SQLite 方言，
#    单写者约束下不能多副本并发写同一个 db 文件（见 19-backend-data-pvc.yaml）。
#    迁移到 PostgreSQL 后：replicas 改回 3、strategy 改回 RollingUpdate、
#    HPA 改回 2/10、PDB 改回 minAvailable: 2，并删除 19-backend-data-pvc.yaml。
# ==============================================================================
# checkov:skip=CKV_K8S_14:Image tag is injected by CI/CD at deploy time (GIT_SHA); placeholder tag only
# checkov:skip=CKV_K8S_43:Image digest pinned by CI/CD at deploy time (GIT_SHA tag); placeholder only
# checkov:skip=CKV_K8S_35:Secrets injected via env from k8s Secret (RBAC-protected, not plaintext in manifests)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metaclouds-backend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/name: metaclouds-backend
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: kustomize
  annotations:
    metaclouds.io/description: "Metaclouds 算力调度平台后端 API（Rust 版）"
# checkov:skip=CKV_K8S_14:Image tag is injected by CI/CD at deploy time (GIT_SHA); placeholder tag only
# checkov:skip=CKV_K8S_43:Image digest pinned by CI/CD at deploy time (GIT_SHA tag); placeholder only
# checkov:skip=CKV_K8S_35:Secrets injected via env from k8s Secret (RBAC-protected, not plaintext in manifests)
spec:
  # SQLite 单写者：只能 1 副本（见文件头说明）
  replicas: 1
  # Recreate：先停旧 Pod 再起新 Pod，杜绝新旧两个 Pod 同时挂载 RWO 数据盘。
  # （RollingUpdate + maxSurge=1 会短暂出现 2 个 Pod 抢同一块盘。）
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metaclouds
      component: backend
  template:
    metadata:
      labels:
        app: metaclouds
        component: backend
        app.kubernetes.io/name: metaclouds-backend
        app.kubernetes.io/part-of: metaclouds
        app.kubernetes.io/component: backend
      annotations:
        # Prometheus 自动发现 annotations（ServiceMonitor 也会抓取，此处为裸 Pod 发现兜底）
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
        # 配置变更时触发滚动更新（CI 注入 checksum）
        metaclouds.io/config-checksum: "PLACEHOLDER"
    spec:
      serviceAccountName: metaclouds-backend
      # 服务账户 token 仅按需挂载（CKV_K8S_38）：后端通过 RBAC 调用 K8s API 时才需要；
      # 当前后端不调用 K8s API（清单由 CI 直接 apply），故不自动挂载 token，减小攻击面。
      automountServiceAccountToken: false
      # Pod 级安全上下文：非 root + seccomp
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 拓扑分布约束：跨节点均匀分布
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: metaclouds
              component: backend
        # 跨可用区分布
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: metaclouds
              component: backend
      # 优雅终止：给在途请求 30 秒
      terminationGracePeriodSeconds: 30
      containers:
        - name: metaclouds-backend
          # 镜像占位：CI 构建时注入真实 tag（如 git commit SHA），禁止 latest
          # （CKV_K8S_14/43 已在上方 checkov skip 注释中说明：tag 由 CI 注入，此占位非最终值）
          image: ghcr.io/customizedvalidation/yunchuang/backend-rust:placeholder
          # CI 每次注入新 GIT_SHA tag，Always 确保拉取最新构建（CKV_K8S_15）
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # 非敏感配置全部从 ConfigMap 注入
          envFrom:
            - configMapRef:
                name: metaclouds-backend-config
          # 敏感凭据从 Secret 注入
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: jwt-secret
            # DATABASE_URL 走 ConfigMap（当前 SQLite 文件路径，非敏感）。
            # 切到 PostgreSQL 后改回从 Secret 取，避免连接串里的口令进 ConfigMap：
            #   - name: DATABASE_URL
            #     valueFrom:
            #       secretKeyRef:
            #         name: metaclouds-secrets
            #         key: database-url
            - name: PROTECTED_ENDPOINTS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: protected-endpoints-token
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: redis-password
            - name: DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metaclouds-secrets
                  key: default-admin-password
          # 资源请求与限制（对齐验收标准：CPU 500m/250m, Memory 512Mi/256Mi）
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # ---- 三探针（路径 /health，见文件头说明）----
          # startupProbe：给慢启动留足时间，最多 30*5=150 秒。
          # 同样用 /health/live：启动阶段只等进程就绪，不应被 DB 可用性卡住，
          # 否则 DB 未就绪会让 Pod 一直卡在启动失败并反复重启。
          startupProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          # livenessProbe：进程存活检测，失败则重启。
          # 必须指向 /health/live（不查库）：若指向带 DB 探测的 /health，
          # 一次数据库抖动会让全部 Pod 被判定死亡并重启，把 DB 故障放大成雪崩。
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # readinessProbe：是否可接收流量，失败则从 Service 摘除。
          # 指向 /health/ready（查库）：DB 不可用时摘流量但不重启。
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          # 容器级安全上下文
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          # 只读根文件系统需要可写临时目录
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run/metaclouds
            # SQLite 数据盘（DATABASE_URL=sqlite:///app/data/metaclouds.db）
            - name: data
              mountPath: /app/data
          # 优雅关闭钩子
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: "100Mi"
        - name: run
          emptyDir:
            sizeLimit: "10Mi"
        - name: data
          persistentVolumeClaim:
            claimName: metaclouds-backend-data
