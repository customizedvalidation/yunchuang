# ==============================================================================
# 01-configmap.yaml — 后端非敏感环境变量
# ==============================================================================
# 所有非敏感配置通过 envFrom 注入 Pod。
# 敏感凭据（JWT / DB 密码 / Redis 密码）见 02-secret.yaml。
#
# 环境变量名与 src/config.rs 中 env_or() 读取的键一一对应。
# 端口统一为 8000（容器内），对齐 Service / Ingress / Prometheus annotations。
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: metaclouds-backend-config
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
data:
  # ---- 服务器基础配置 ----
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  SERVER_ENV: "production"

  # ---- CORS ----
  # 生产环境必须显式列出前端来源；留空 = 不回任何 CORS 头（等价拒绝跨源）。
  ALLOWED_ORIGINS: "https://app.metaclouds.example.com"
  # 只有直连对端在这些网段内时，才采信 X-Forwarded-For（否则限流可被伪造头绕过）
  TRUSTED_PROXIES: "10.0.0.0/8"
  # /metrics 与 /swagger-ui 的生产访问白名单（未命中则需 PROTECTED_ENDPOINTS_TOKEN）。
  # 与 TRUSTED_PROXIES 一致即可让集群内 Prometheus 与 kubectl port-forward 直连抓取。
  METRICS_TRUSTED_CIDRS: "10.0.0.0/8"

  # ---- 数据库 ----
  # ⚠️ 当前阶段：SQLite + PVC 单副本（19-backend-data-pvc.yaml）。
  #    原因：请求层仍是 SQLite 方言（`?N` 占位符 + last_insert_rowid），
  #    main.rs 在 Postgres 模式下会 fail-closed 直接退出，多副本又会并发写
  #    同一个 db 文件。PostgreSQL 工作负载已在 17-postgresql.yaml 就绪。
  #
  #    切到 PostgreSQL 的完整动作（方言迁移完成后）：
  #      1. USE_SQLITE: "true"            → "false"
  #      2. 删掉 DATABASE_URL 这一行（改由 02-secret.yaml 的 database-url 注入，见 05-deployment.yaml 注释）
  #      3. 05-deployment.yaml replicas 1→3、strategy Recreate→RollingUpdate、
  #         07-hpa.yaml 1/1→2/10、08-pdb.yaml maxUnavailable→minAvailable: 2，
  #         并删除 19-backend-data-pvc.yaml
  USE_SQLITE: "true"
  MEMORY_STORE_ENABLED: "false"
  DATABASE_URL: "sqlite:///app/data/metaclouds.db"
  # 以下 PostgreSQL 参数在 SQLite 阶段不生效，切库时直接启用（与 17-postgresql.yaml 对齐）
  DATABASE_HOST: "postgresql.metaclouds.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "metaclouds"
  DATABASE_USER: "metaclouds_user"
  DATABASE_SSL_MODE: "require"

  # ---- Redis ----
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis.metaclouds.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # ---- JWT（密钥本身在 Secret 中）----
  JWT_EXPIRATION_HOURS: "24"
  JWT_REFRESH_EXPIRATION_HOURS: "168"

  # ---- 监控 / 可观测性 ----
  PROMETHEUS_ENABLED: "true"
  MONITORING_ENABLED: "true"
  ALERT_ENABLED: "true"
  METRICS_COLLECTION_INTERVAL_SECONDS: "15"
  TRACING_ENABLED: "false"
  TRACING_SERVICE_NAME: "metaclouds-backend-rust"
  OTEL_ENABLED: "false"

  # ---- K8s 集成 ----
  K8S_ENABLED: "true"
  K8S_NAMESPACE: "metaclouds"
  K8S_SIMULATION_MODE: "false"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_INTERVAL_SECONDS: "10"

  # ---- 限流 / 熔断 ----
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_DURATION_SECONDS: "60"
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "50"

  # ---- 日志 ----
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "console"

  # ---- HTTP 超时 ----
  MAX_REQUEST_BODY_SIZE: "104857600"
  READ_TIMEOUT_SECONDS: "30"
  WRITE_TIMEOUT_SECONDS: "60"
  IDLE_TIMEOUT_SECONDS: "120"

  # ---- 功能开关 ----
  FEATURE_GPU_ALLOCATION: "true"
  FEATURE_JOB_SCHEDULER: "true"
  FEATURE_MONITORING: "true"
  FEATURE_SECURITY_POLICIES: "true"

  # ---- 安全 ----
  ALLOW_PUBLIC_REGISTRATION: "false"
  COOKIE_SAME_SITE: "lax"
  COOKIE_SECURE: "true"
