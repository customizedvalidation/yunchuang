# ==============================================================================
# 01-configmap.yaml — 后端非敏感环境变量
# ==============================================================================
# 所有非敏感配置通过 envFrom 注入 Pod。
# 敏感凭据（JWT / DB 密码 / Redis 密码）见 02-secret.yaml。
#
# 环境变量名与 src/config.rs 中 env_or() 读取的键一一对应。
# 端口统一为 8000（容器内），对齐 Service / Ingress / Prometheus annotations。
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: metaclouds-backend-config
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
data:
  # ---- 服务器基础配置 ----
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8000"
  SERVER_ENV: "production"

  # ---- CORS ----
  # 生产环境必须显式列出前端来源；留空 = 不回任何 CORS 头（等价拒绝跨源）。
  ALLOWED_ORIGINS: "https://app.metaclouds.example.com"
  # 只有直连对端在这些网段内时，才采信 X-Forwarded-For（否则限流可被伪造头绕过）
  TRUSTED_PROXIES: "10.0.0.0/8"
  # /metrics 与 /swagger-ui 的生产访问白名单（未命中则需 PROTECTED_ENDPOINTS_TOKEN）。
  # 与 TRUSTED_PROXIES 一致即可让集群内 Prometheus 与 kubectl port-forward 直连抓取。
  METRICS_TRUSTED_CIDRS: "10.0.0.0/8"

  # ---- 数据库 ----
  # ✅ 已切到 PostgreSQL（多副本 HA）：请求层双驱动方言已完成（?N ⇄ $N、
  #    last_insert_rowid ⇄ RETURNING id），main.rs 按 USE_SQLITE/DATABASE_URL
  #    自动选择驱动；USE_SQLITE=false 即走 Postgres（见 17-postgresql.yaml）。
  #    配套：05-deployment 已 3 副本 + RollingUpdate，07-hpa 2/10，08-pdb
  #    minAvailable:2，19-backend-data-pvc.yaml 已删除。
  # ⚠️ 前置：必须先部署 17-postgresql StatefulSet 并通过 02-secret 注入真实的
  #    database-url（postgresql://...）；缺失或占位会导致后端 fail-closed 退出。
  USE_SQLITE: "false"
  MEMORY_STORE_ENABLED: "false"
  # DATABASE_URL 改由 02-secret.yaml 的 database-url 注入（见 05-deployment.yaml），
  # 不再在此硬编码 SQLite 路径；DATABASE_HOST/PORT/NAME/USER/SSL_MODE 供 DSN 兜底拼装。
  # 以下 PostgreSQL 参数在 SQLite 阶段不生效，切库时直接启用（与 17-postgresql.yaml 对齐）
  DATABASE_HOST: "postgresql.metaclouds.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "metaclouds"
  DATABASE_USER: "metaclouds_user"
  DATABASE_SSL_MODE: "require"

  # ---- Redis ----
  REDIS_ENABLED: "true"
  REDIS_HOST: "redis.metaclouds.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"

  # ---- JWT（密钥本身在 Secret 中）----
  JWT_EXPIRATION_HOURS: "24"
  JWT_REFRESH_EXPIRATION_HOURS: "168"

  # ---- 监控 / 可观测性 ----
  PROMETHEUS_ENABLED: "true"
  MONITORING_ENABLED: "true"
  ALERT_ENABLED: "true"
  METRICS_COLLECTION_INTERVAL_SECONDS: "15"
  TRACING_ENABLED: "false"
  TRACING_SERVICE_NAME: "metaclouds-backend-rust"
  OTEL_ENABLED: "false"

  # ---- K8s 集成 ----
  # P1-3（2026-11-09）：本机未接入 kube-rs，K8s 只读面固定走 MockK8sClient。
  # 与 05-deployment.yaml 的 automountServiceAccountToken: false 保持一致：
  # 没有真实客户端就不挂载 SA token（最小权限）。接入真实客户端时，
  # 需同时把本项改 true、开启 token 挂载并复核 09-rbac 的 Role 权限。
  K8S_ENABLED: "false"
  K8S_NAMESPACE: "metaclouds"
  # 该开关现在**有真实语义**（handlers/k8s.rs::ensure_mock_allowed）：
  #   true  = 明确返回 mock 数据，前端 /system/mode 同步展示演示模式横幅；
  #   false = 真实客户端未接线，K8s 只读端点 fail-closed 返回错误，绝不伪造数据。
  # 设为 false 不会「切到真实集群」，只会让 K8s 页面不可用。
  K8S_SIMULATION_MODE: "true"
  SCHEDULER_ENABLED: "true"
  SCHEDULER_INTERVAL_SECONDS: "10"

  # ---- 执行模式知情开关（P0-1 生产 fail-closed 守卫）----
  # SERVER_ENV=production 且未显式承认演示模式时，后端 validate() 会拒绝启动。
  # 本清单对应「演示集群」：作业执行体与 K8s 数据均为模拟，故显式设为 true。
  # ⚠️ 作为真实算力平台交付前，必须改为 false 并把 DISPATCH_ENABLED 设为 false
  #    （或接入真实执行器后移除模拟路径），否则生产仍会把模拟完成态当真实结果。
  ALLOW_SIMULATED_EXECUTION: "true"

  # ---- 调度闭环（P0/P1/P2）----
  # ⚠️ 显式声明，避免依赖代码默认值隐式开启模拟执行：当前执行体为 sleep 后直接
  #    置 completed，实耗 = 申请量 × DISPATCH_SIMULATED_UTILIZATION，均为模拟数据。
  #    接入真实执行器前，作业状态 / 利用率 / 双账本回收不得作为对外服务依据。
  DISPATCH_ENABLED: "true"
  DISPATCH_SIMULATED_RUN_MS: "2000"
  DISPATCH_SIMULATED_UTILIZATION: "0.75"

  # ---- 限流 / 熔断 ----
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_DURATION_SECONDS: "60"
  CIRCUIT_BREAKER_ENABLED: "true"
  CIRCUIT_BREAKER_THRESHOLD: "50"

  # ---- 日志 ----
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "console"

  # ---- HTTP 超时 ----
  MAX_REQUEST_BODY_SIZE: "104857600"
  READ_TIMEOUT_SECONDS: "30"
  WRITE_TIMEOUT_SECONDS: "60"
  IDLE_TIMEOUT_SECONDS: "120"

  # ---- 功能开关 ----
  FEATURE_GPU_ALLOCATION: "true"
  FEATURE_JOB_SCHEDULER: "true"
  FEATURE_MONITORING: "true"
  FEATURE_SECURITY_POLICIES: "true"

  # ---- 安全 ----
  ALLOW_PUBLIC_REGISTRATION: "false"
  COOKIE_SAME_SITE: "lax"
  COOKIE_SECURE: "true"
  # P1-4：撤销名单检查默认 fail-closed。Redis 曾成功接入后失效时返回 503，
  # 不放行已登出的令牌；从未部署 Redis 的环境仍按无缓存降级，不会全站 503。
  REVOCATION_FAIL_CLOSED: "true"
