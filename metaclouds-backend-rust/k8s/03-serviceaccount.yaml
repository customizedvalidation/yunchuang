# ==============================================================================
# 03-serviceaccount.yaml — ServiceAccount（非 root，最小权限）
# ==============================================================================
# 为后端创建专用 ServiceAccount，不使用 default。
# 后端需要访问 K8s API 进行作业调度（创建 Job / 查看 Pod 日志）。
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metaclouds-backend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    # Workload Identity 占位（按云厂商取消注释并填写）
    # EKS IRSA:
    # eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/metaclouds-backend-role"
    metaclouds.io/description: "后端服务账户（Rust 版），用于 K8s 作业调度与 Pod 管理"
automountServiceAccountToken: true
