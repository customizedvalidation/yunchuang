# ==============================================================================
# 13-kustomization.yaml — Kustomize 统一资源引用
# ==============================================================================
# 用法：
#   kubectl apply -k k8s/
#   kubectl kustomize k8s/    # 渲染后查看（本机无 kubectl，待 CI 验证）
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# kustomize v5 起 Kustomization 的 metadata.name 已被弃用（保留会触发
# "metadata.name in kustomization is deprecated" 甚至构建失败），故移除。
resources:
  - 00-namespace.yaml
  - 01-configmap.yaml
  - 02-secret.yaml
  - 03-serviceaccount.yaml
  - 04-role.yaml
  - 05-deployment.yaml
  - 06-service.yaml
  - 07-hpa.yaml
  - 08-pdb.yaml
  - 09-networkpolicy.yaml
  - 10-ingress.yaml
  - 11-servicemonitor.yaml
  - 12-prometheusrule.yaml
  # 数据面：PostgreSQL（17，后端已切到它做多副本 HA）+ Redis（18，会话撤销名单在用）
  - 17-postgresql.yaml
  - 18-redis.yaml
  - 14-frontend-deployment.yaml
  - 15-frontend-service.yaml
  - 16-frontend-networkpolicy.yaml

# 公共 labels（自动注入到所有资源）
commonLabels:
  app.kubernetes.io/part-of: metaclouds
  app.kubernetes.io/managed-by: kustomize

# 镜像 tag：默认 main（CI 在 push 到 main 时按 type=ref,event=branch 推送该分支 tag），
# 手动 kubectl apply -k 即可拉到，消除 placeholder 导致的 ImagePullBackOff。
# 生产钉版本请用 scripts/deploy-k8s.sh GIT_SHA=...（不可变 sha tag）。
# 禁止 latest。
images:
  - name: ghcr.io/customizedvalidation/yunchuang/backend-rust
    newTag: main
  - name: ghcr.io/customizedvalidation/yunchuang/frontend
    newTag: main
