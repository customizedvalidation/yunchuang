name: ci-rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # 占位值，供 sqlx 宏编译（当前未使用，保留以便后续接入）。
  DATABASE_URL: "sqlite::memory:"
  JWT_SECRET: "ci-jwt-secret-at-least-32-characters-long-pad"

jobs:
  # 主流水线：格式检查 + clippy + 测试 + 调试构建。
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # 依赖缓存：registry + git checkout + target 目录。
      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build (debug)
        run: cargo build

  # Postgres 双驱动冒烟测试：使用 postgres:16 service 容器，
  # 运行 #[ignore] 标记的 postgres_smoke_test（本机无 Postgres 时默认跳过）。
  # 验证 JSONB / TIMESTAMPTZ / 软删除 / UPSERT 等 Postgres 方言关键路径。
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      USE_SQLITE: "false"
      JWT_SECRET: "ci-jwt-secret-at-least-32-characters-long-pad"
      # 冒烟测试全部用运行时 SQL（无 query! 宏），不依赖 sqlx 离线缓存。
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pg-

      - name: Run Postgres smoke tests (--ignored)
        run: cargo test --test postgres_smoke_test -- --ignored --nocapture

      - name: Run Postgres integration tests (migrations + JSONB codec + CRUD)
        run: cargo test --test postgres_integration_test -- --ignored --nocapture

  # 覆盖率统计：初期只统计、不阻塞 PR，输出摘要与产物。
  coverage:
    runs-on: ubuntu-latest
    needs: lint-test
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run coverage, print summary and write lcov.info
        run: |
          cargo llvm-cov --all-features --summary
          cargo llvm-cov --all-features --lcov --output-path lcov.info

      - name: Upload coverage (LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

  # Release 构建作为独立 job，验证优化产物可正常编译。
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: cargo build --release
        run: cargo build --release
