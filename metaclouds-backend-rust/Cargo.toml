[package]
name = "metaclouds-backend-rust"
version = "2.0.1"
edition = "2021"
description = "Metaclouds compute scheduling backend (Rust/axum + SQLx, SQLite/Postgres dual driver)."
license = "MIT"

[features]
default = []
# P2-1：旧的纯内存态 priority_scheduler 从未在生产进程接线，默认不编译，
# 避免与 services::dispatch 的 DB 调度闭环形成「双实现并存」的误读。
# 需要对照 Go 行为契约时用 `cargo test --features legacy-scheduler` 恢复。
legacy-scheduler = []

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
    "sqlite",
    "postgres",
    "runtime-tokio-rustls",
    "chrono",
    "macros",
    "migrate",
    "json",
] }
bcrypt = "0.15"
jsonwebtoken = "9"
argon2 = "0.5"
tower-cookies = { version = "0.11", features = ["axum-core"] }
futures-util = "0.3"
validator = { version = "0.18", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
# 横切中间件：CorsLayer（按 ALLOWED_ORIGINS 精确装配）/ RequestBodyLimitLayer /
# TimeoutLayer（全局限时）/ CompressionLayer（gzip 响应压缩）
tower-http = { version = "0.6", features = ["cors", "limit", "timeout", "compression-gzip"] }
# 解析 TRUSTED_PROXIES 的 CIDR，用于判定是否采信 X-Forwarded-For
ipnet = "2"

# === Phase 3 横切能力依赖 ===
# P3-01 Redis 会话/缓存
redis = { version = "0.27", features = ["tokio-comp", "connection-manager", "script"] }
# P3-03 Prometheus 指标
prometheus = "0.13"
# P3-02 定时任务
tokio-cron-scheduler = "0.10"
# P3-04 tracing + OpenTelemetry
opentelemetry = { version = "0.27", features = ["trace"] }
# opentelemetry-sdk 自 0.27 起独立成 crate（TracerProvider/Sampler/Resource 所在），
# 经 opentelemetry-otlp 传递引入并已在本地缓存，提升为直接依赖以便直接引用其类型。
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.27"
tracing-opentelemetry = "0.28"
# P3-05 OpenAPI
# R11：utoipa 6 / utoipa-swagger-ui 10（MSRV 1.88，CI 固定 rustc 1.96）。
# 连带把 build-dependency `zip` 从 ^3.0 提升到 ^9.0，真实消除
# RUSTSEC-2026-0367/0368/0369/0429 四条豁免（见 docs/system-fixes-2026-11-09.md）。
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }

# 传递依赖修复（非业务依赖，勿删）：
#   opentelemetry-otlp(grpc-tonic) → tonic 0.12 → tower 0.4.13 → indexmap 1.9.3
# tower 0.4.13 将 indexmap 声明为 optional 且未开启 std，而 indexmap 1.9.3 在
# 无 std 时 `IndexMap` 的第三泛型参数（S）没有默认值，导致 tower::ready_cache
# 编译失败（E0107）。cargo 的 feature 统一会让同一版本的 indexmap 共享特性，
# 故提升为直接依赖并显式开启 std 即可修复。
indexmap = { version = "1.9", features = ["std"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
