# ==============================================================================
# Metaclouds 命名空间
# ==============================================================================
# 所有 Metaclouds 工作负载均部署在此命名空间下。
# 通过 labels 标识应用归属，便于 NetworkPolicy / 监控 / 成本分摊。
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: metaclouds
  labels:
    app.kubernetes.io/name: metaclouds
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/managed-by: kustomize
    # 标识为生产环境命名空间，NetworkPolicy 默认拒绝策略依赖此 label
    environment: production
    # 允许 Prometheus 在命名空间级别发现 scrape 目标
    prometheus.io/scrape: "true"
