# ============================================================================
# 5. GPU 网络亲和性调度示例（podAffinity）
# ============================================================================
# 使用 podAffinity 和 topologySpreadConstraints 实现：
#   - 同作业的训练 Pod 优先调度到同一网络交换机下（减少跨交换机通信）
#   - 避免同一作业的 Pod 集中在同一节点（节点级反亲和）
#   - GPU 节点与 RDMA 网卡的亲和性（GPU 直连 RDMA 网卡的节点优先）
# ============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: example-gpu-network-affinity
  namespace: team-algorithm
  labels:
    app: metaclouds
    component: training-job
    job-name: distributed-training-001
  annotations:
    metaclouds.io/job-type: "distributed-training"
    metaclouds.io/network-requirement: "rdma"
    metaclouds.io/topology-preference: "same-switch"
spec:
  affinity:
    # Pod 亲和：同作业的 Pod 优先调度到同一网络交换机
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app: metaclouds
                component: training-job
                job-name: distributed-training-001
            topologyKey: "network.metaclouds.io/switch-id"
            namespaces:
              - team-algorithm
    # Pod 反亲和：同作业 Pod 不调度到同一节点
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: metaclouds
              component: training-job
              job-name: distributed-training-001
          topologyKey: "kubernetes.io/hostname"
          namespaces:
            - team-algorithm
    # 节点亲和：优先调度到有 RDMA 网卡且 GPU 直连 RDMA 的节点
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: network.metaclouds.io/rdma
                operator: In
                values:
                  - "true"
        - weight: 80
          preference:
            matchExpressions:
              - key: network.metaclouds.io/gpu-direct-rdma
                operator: In
                values:
                  - "true"
  # 拓扑分布约束：跨机架均匀分布
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "topology.kubernetes.io/zone"
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: metaclouds
          component: training-job
          job-name: distributed-training-001
  nodeSelector:
    gpu-vendor: nvidia
    gpu-model: A100
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  containers:
    - name: training
      image: nvcr.io/nvidia/pytorch:23.10-py3
      resources:
        requests:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: "2"
          # rdma/rdma_shared: "1"  # 取消注释以请求 RDMA 设备
        limits:
          cpu: "16"
          memory: "64Gi"
          nvidia.com/gpu: "2"
          # rdma/rdma_shared: "1"
      env:
        - name: NCCL_IB_DISABLE
          value: "0"
        - name: NCCL_IB_GID_INDEX
          value: "3"
        - name: NCCL_SOCKET_IFNAME
          value: "eth1"
        - name: NCCL_NET_GDR_LEVEL
          value: "5"
        - name: NCCL_DEBUG
          value: "INFO"

---
# ============================================================================
# 6. 网络拓扑配置说明（注释）
# ============================================================================
# 三网物理拓扑规划：
#
#   ┌─────────────┐    ┌─────────────┐    ┌─────────────┐
#   │  管理网交换机 │    │  存储网交换机 │    │  计算网交换机 │
#   │  10.0.0.0/16 │    │ 10.200.0.0/16│   │ 10.100.0.0/16│
#   │  (1G/10G)    │    │   (25G)      │    │ (100G RoCE/IB)│
#   └──────┬──────┘    └──────┬──────┘    └──────┬──────┘
#          │                  │                  │
#   ┌──────┴──────────────────┴──────────────────┴──────┐
#   │              GPU 计算节点（多网卡）                  │
#   │  eth0(管理)  eth1(存储)  eth2(计算/RDMA)  GPU×8    │
#   └───────────────────────────────────────────────────┘
#
# 节点标签建议（集群管理员设置）：
#   network.metaclouds.io/rdma=true          # 节点有 RDMA 网卡
#   network.metaclouds.io/gpu-direct-rdma=true  # GPU 与 RDMA 网卡直连（PCIe/NVLink）
#   network.metaclouds.io/switch-id=switch-01  # 节点连接的交换机 ID
#   network.metaclouds.io/roce=true           # 支持 RoCEv2
#   network.metaclouds.io/ib=true             # 支持 InfiniBand
#
# NCCL 环境变量速查：
#   NCCL_IB_DISABLE=0          # 启用 IB/RoCE
#   NCCL_IB_GID_INDEX=3        # RoCEv2 GID 索引
#   NCCL_SOCKET_IFNAME=eth1    # NCCL 通信网卡
#   NCCL_NET_GDR_LEVEL=5       # GPUDirect RDMA 级别
#   NCCL_DEBUG=INFO            # 调试日志
#   NCCL_ALGO=Ring             # 集合通信算法
#   NCCL_PROTO=Simple          # 通信协议
# ==============================================================================
