# 4. RDMA 设备插件 DaemonSet（注释形式）
# ============================================================================
# 需要 rdma-shared-device-plugin：
#   https://github.com/Mellanox/k8s-rdma-shared-dev-plugin
# 部署后，K8s 节点会暴露 rdma/hca 或 rdma/rdma_shared 资源，
# Pod 可通过 resources.limits 请求 RDMA 设备。
#
# 部署命令：
#   kubectl apply -f https://raw.githubusercontent.com/Mellanox/k8s-rdma-shared-dev-plugin/master/deployments/rdma-shared-dev-plugin.yml
