# ==============================================================================
# Metaclouds 网络拓扑与 RDMA 配置
# ==============================================================================
# 对应 skill.md §4.1「AI 网络资源」与 §4.3「通信优化：RDMA」。
# 展示 RoCE / InfiniBand 高速网络配置、三网隔离（管理网/存储网/计算网）、
# RDMA 设备插件、以及 GPU 网络亲和性调度示例。
#
# 重要说明：
#   - NetworkAttachmentDefinition 需要 Multus CNI 插件，本清单为配置示例
#   - RDMA 设备插件（rdma-shared-device-plugin）需单独部署
#   - 实际 RDMA 配置依赖真实硬件（支持 RoCEv2 的网卡或 InfiniBand HCA）
#   - 注释部分为需要外部组件的配置，取消注释前请确保对应组件已安装
# ==============================================================================

---
# ============================================================================
# 1. RoCE 网络配置（NetworkAttachmentDefinition）
# ============================================================================
# 需要 Multus CNI 插件：https://github.com/k8snetworkplumbingwg/multus-cni
# 部署 Multus 后，取消下方注释即可创建 RoCE 网络附件定义。
# RoCE（RDMA over Converged Ethernet）在以太网上实现 RDMA，
# 需要网卡支持 RoCEv2，并配置 PFC（优先级流量控制）和 ECN（显式拥塞通知）。
# ============================================================================
# apiVersion: k8s.cni.cncf.io/v1
# kind: NetworkAttachmentDefinition
# metadata:
#   name: roce-network
#   namespace: metaclouds
#   labels:
#     app: metaclouds
#     component: network-topology
#     network-type: roce
#   annotations:
#     metaclouds.io/description: "RoCEv2 高速计算网络，用于分布式训练节点间通信"
# spec:
#   config: |
#     {
#       "cniVersion": "0.3.1",
#       "name": "roce-network",
#       "type": "macvlan",
#       "master": "eth1",
#       "mode": "bridge",
#       "ipam": {
#         "type": "host-local",
#         "subnet": "10.100.0.0/16",
#         "rangeStart": "10.100.1.0",
#         "rangeEnd": "10.100.254.254",
#         "gateway": "10.100.0.1"
#       }
#     }
#
# ---
# RoCE 网络配置说明：
#   - master: "eth1" 为 RoCE 网卡设备名，按实际环境修改
#   - subnet: 10.100.0.0/16 为计算网网段，与管理网/存储网隔离
#   - PFC/ECN 需在交换机和网卡驱动层面配置，不在 K8s 清单范围内
#   - NCCL 环境变量配置（见 17-job-templates.yaml）：
#       NCCL_IB_DISABLE=0
#       NCCL_IB_GID_INDEX=3
#       NCCL_SOCKET_IFNAME=eth1
#       NCCL_NET_GDR_LEVEL=5

---
# ============================================================================
# 2. InfiniBand 网络配置（NetworkAttachmentDefinition）
# ============================================================================
# 需要 Multus CNI + InfiniBand CNI 插件。
# InfiniBand 提供更低延迟和更高带宽，适合超大规模分布式训练。
# ============================================================================
# apiVersion: k8s.cni.cncf.io/v1
# kind: NetworkAttachmentDefinition
# metadata:
#   name: ib-network
#   namespace: metaclouds
#   labels:
#     app: metaclouds
#     component: network-topology
#     network-type: infiniband
#   annotations:
#     metaclouds.io/description: "InfiniBand 高速计算网络"
# spec:
#   config: |
#     {
#       "cniVersion": "0.3.1",
#       "name": "ib-network",
#       "type": "ib-sriov",
#       "deviceID": "mlx5_0",
#       "isRdma": true,
#       "ipam": {
#         "type": "host-local",
#         "subnet": "10.101.0.0/16",
#         "gateway": "10.101.0.1"
#       }
#     }
#
# ---
# InfiniBand 配置说明：
#   - deviceID: "mlx5_0" 为 IB HCA 设备名，按实际环境修改
#   - isRdma: true 启用 RDMA 支持
#   - 需要 ib-sriov-cni 插件和 RDMA shared device plugin
#   - NCCL 环境变量：
#       NCCL_IB_DISABLE=0
#       NCCL_IB_HCA=mlx5
#       NCCL_IB_GID_INDEX=3

---
# ============================================================================
# 3. 三网隔离 NetworkPolicy（管理网 / 存储网 / 计算网）
# ============================================================================
# 通过 NetworkPolicy 实现三类网络流量的逻辑隔离：
#   - 管理网（management）：集群管理、API 调用、监控采集
#   - 存储网（storage）：Ceph/NFS 存储访问、数据读写
#   - 计算网（compute）：分布式训练节点间 RDMA 通信、NCCL 集合通信
#
# 物理隔离需多网卡 + 交换机 VLAN 配置，NetworkPolicy 实现逻辑层面的
# 流量控制，防止训练流量干扰管理流量。
# ============================================================================

# ---- 管理网 NetworkPolicy：允许监控采集和 API 访问 ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-management-network
  namespace: metaclouds
  labels:
    app: metaclouds
    component: network-policy
    network-zone: management
spec:
  podSelector:
    matchLabels:
      app: metaclouds
  policyTypes:
    - Ingress
  ingress:
    # 允许 Prometheus 监控采集（管理网）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080  # backend metrics
        - protocol: TCP
          port: 9090  # prometheus
    # 允许 ingress-nginx 访问（管理网入口）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 8080

---
# ---- 存储网 NetworkPolicy：允许存储访问 ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-storage-network
  namespace: metaclouds
  labels:
    app: metaclouds
    component: network-policy
    network-zone: storage
spec:
  podSelector:
    matchLabels:
      app: metaclouds
      component: backend
  policyTypes:
    - Egress
  egress:
    # 允许访问 Ceph RBD（存储网）
    - to:
        - ipBlock:
            cidr: 10.200.0.0/16  # 存储网网段，按实际环境修改
      ports:
        - protocol: TCP
          port: 6789  # Ceph MON
        - protocol: TCP
          port: 6800  # Ceph OSD 起始端口
        - protocol: TCP
          port: 6801
        - protocol: TCP
          port: 6802
    # 允许访问 NFS（存储网）
    - to:
        - ipBlock:
            cidr: 10.200.0.0/16
      ports:
        - protocol: TCP
          port: 2049  # NFS
        - protocol: TCP
          port: 111   # rpcbind

---
# ---- 计算网 NetworkPolicy：允许训练节点间通信 ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-compute-network
  namespace: team-algorithm
  labels:
    app: metaclouds
    component: network-policy
    network-zone: compute
spec:
  podSelector:
    matchLabels:
      app: metaclouds
      component: training-job
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 允许同命名空间内训练节点间通信（计算网）
    - from:
        - podSelector:
            matchLabels:
              app: metaclouds
              component: training-job
      # 放行所有端口，NCCL 使用动态端口
      # 生产环境建议限制为 NCCL 端口范围（如 20000-30000）
  egress:
    # 允许训练节点间出站通信
    - to:
        - podSelector:
            matchLabels:
              app: metaclouds
              component: training-job
    # 允许访问存储（读取训练数据）
    - to:
        - ipBlock:
            cidr: 10.200.0.0/16
      ports:
        - protocol: TCP
          port: 2049
        - protocol: TCP
          port: 6789

---
