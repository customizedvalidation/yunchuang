---
# ============================================================================
# 3. team-algorithm LimitRange
# ============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: team-algorithm-limits
  namespace: team-algorithm
  labels:
    app: metaclouds
    component: limit-range
    team: algorithm
    app.kubernetes.io/part-of: metaclouds
  annotations:
    metaclouds.io/description: "算法训练团队单 Pod 资源范围限制"
    metaclouds.io/gpu-note: "分布式训练多机多卡场景下，单 Pod 最多 8 GPU，多 Pod 通过 Job 编排"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
        nvidia.com/gpu: "0"
      default:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
      min:
        cpu: "100m"
        memory: "128Mi"
        nvidia.com/gpu: "0"
      max:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "8"
    - type: Pod
      max:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "8"

---
# ============================================================================
# 4. LimitRange 行为说明（注释）
# ============================================================================
# 生效规则：
#   1. 用户提交 Pod 时未指定 resources.requests → 注入 defaultRequest
#   2. 用户提交 Pod 时未指定 resources.limits   → 注入 default
#   3. 用户指定的 request < min → 拒绝创建（Forbidden）
#   4. 用户指定的 limit > max   → 拒绝创建（Forbidden）
#   5. Pod 级别 max 限制所有容器资源之和，超出则拒绝
#
# GPU 细粒度与 LimitRange：
#   - nvidia.com/gpu 在 K8s 原生为整数资源，LimitRange 的 min/max 为整数
#   - 1/2 GPU、1/4 GPU 通过 MIG 资源名（如 nvidia.com/mig-1g.5gb）请求，
#     不受本 LimitRange 的 nvidia.com/gpu 限制，需在 Metaclouds 平台层校验
#   - Metaclouds GPU 管理服务在提交前会将细粒度请求换算为等效整卡，
#     并校验是否超出 Namespace ResourceQuota
#
# 查看 LimitRange：
#   kubectl describe limitrange team-infra-limits -n team-infra
#   kubectl describe limitrange team-data-limits -n team-data
#   kubectl describe limitrange team-algorithm-limits -n team-algorithm
#
# 调整建议：
#   - 推理服务：可降低 default CPU/memory，提高 GPU limit 上限
#   - 训练作业：保持较高 default memory，避免 OOM
#   - 数据预处理：提高 CPU limit，GPU request 设为 0
# ==============================================================================
