# ==============================================================================
# Metaclouds 单 Pod 资源范围限制（LimitRange）
# ==============================================================================
# 对应 skill.md §4.2「LimitRange：限制单个 Pod 的资源使用范围」。
# 为每个团队 Namespace 设置 Pod 和 Container 级别的资源上下限与默认值。
#
# 限制规则：
#   最小 CPU: 100m,  最大 CPU: 16
#   最小内存: 128Mi, 最大内存: 64Gi
#   最小 GPU: 0,     最大 GPU: 8
#   默认 CPU request: 500m, 默认 CPU limit: 2
#   默认内存 request: 512Mi, 默认内存 limit: 4Gi
#   默认 GPU request: 0, 默认 GPU limit: 1
#
# 包含两种类型：
#   - Container：适用于每个容器，设置默认 request/limit 和最大/最小值
#   - Pod：适用于整个 Pod（所有容器之和），设置最大资源上限
#
# 前置条件：Namespace 已在 00-namespace.yaml 中创建。
# ==============================================================================

---
# ============================================================================
# 1. team-infra LimitRange
# ============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: team-infra-limits
  namespace: team-infra
  labels:
    app: metaclouds
    component: limit-range
    team: infra
    app.kubernetes.io/part-of: metaclouds
  annotations:
    metaclouds.io/description: "基础服务团队单 Pod 资源范围限制"
spec:
  limits:
    # ---- Container 级别限制 ----
    - type: Container
      # 默认资源请求（用户未指定时自动注入）
      defaultRequest:
        cpu: "500m"
        memory: "512Mi"
        nvidia.com/gpu: "0"
      # 默认资源上限（用户未指定时自动注入）
      default:
        cpu: "2"
        memory: "4Gi"
        nvidia.com/gpu: "1"
      # 最小资源请求（用户指定的 request 不得低于此值）
      min:
        cpu: "100m"
        memory: "128Mi"
        nvidia.com/gpu: "0"
      # 最大资源上限（用户指定的 limit 不得高于此值）
      max:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "8"
    # ---- Pod 级别限制（所有容器资源之和）----
    - type: Pod
      max:
        cpu: "16"
        memory: "64Gi"
        nvidia.com/gpu: "8"

---
