# ==============================================================================
# Metaclouds Kubernetes Secret 配置（fail-secure 模板）
# ==============================================================================
# ⚠️  安全警告：本文件是「模板」，不含任何真实密钥值。data 字段刻意留空，
#     直接 kubectl apply 会得到空 Secret，应用因读不到密钥而拒绝启动
#     （fail-secure），从而强制你在部署前先生成真实密钥。
#
# ⚠️  切勿将真实密钥值提交到此文件并 push 到 Git——那等于把凭据写进公开仓库。
#
# 生成并创建真实 Secret 的正确方式（任选其一）：
#
#   方式 1：kubectl create secret（推荐，最简单）
#   ---------------------------------------------------------------------------
#   kubectl -n metaclouds create secret generic metaclouds-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=database-password="$(openssl rand -base64 24)" \
#     --from-literal=redis-password="$(openssl rand -base64 24)" \
#     --from-literal=default-admin-password="$(openssl rand -base64 18)" \
#     --from-literal=csrf-secret="$(openssl rand -base64 32)"
#
#   方式 2：从已轮换的 .env.production 生成（仓库脚本）
#   ---------------------------------------------------------------------------
#   cd metaclouds-backend && ./deploy/generate_k8s_secrets.sh
#
#   方式 3：生产环境强烈推荐 —— Sealed Secrets / External Secrets Operator
#   ---------------------------------------------------------------------------
#   将密钥托管在集群外（AWS Secrets Manager / HashiCorp Vault / GCP Secret Manager），
#   Git 中仅存加密后的 SealedSecret 或 ExternalSecret 引用，避免任何明文进入仓库。
#
# 密钥强度要求：
#   - jwt-secret:             ≥ 32 字节（config.Validate 强制，建议 48 字节 base64）
#   - database-password:      ≥ 16 字节，建议 24 字节 base64
#   - redis-password:         ≥ 16 字节，建议 24 字节 base64
#   - default-admin-password: ≥ 12 字节，建议 18 字节 base64
#   - csrf-secret:            ≥ 32 字节（用于 CSRF 令牌签名，建议 32 字节 base64）
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: metaclouds-secrets
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    # 标识此 Secret 由模板管理，真实值应通过外部方式注入
    metaclouds.io/managed-by: "template"
    metaclouds.io/rotation-policy: "90d"
type: Opaque
# ---- 密钥键名说明（与 Deployment 中 secretKeyRef 对应）----
# jwt-secret              → JWT 签名密钥（环境变量 JWT_SECRET）
# database-password       → PostgreSQL 密码（环境变量 DATABASE_PASSWORD）
# redis-password          → Redis 密码（环境变量 REDIS_PASSWORD）
# default-admin-password  → 初始管理员密码（首次启动时创建 admin 用户）
# csrf-secret             → CSRF 令牌签名密钥
#
# ⚠️  data 字段留空：这是 fail-secure 设计。
#     请勿在此处填入 ${PLACEHOLDER} 以外的任何值，更不要填入真实密钥。
#     真实 Secret 必须通过上方「方式 1/2/3」创建，创建后此模板文件中的
#     空 data 不会覆盖已有 Secret（kubectl apply 对已存在资源是合并策略）。
data: {}
# stringData 占位：若使用 Sealed Secrets，可在此处放置加密后的值；
# 普通部署请留空，使用 kubectl create secret 生成。
# stringData:
#   jwt-secret: "${JWT_SECRET_PLACEHOLDER}"
#   database-password: "${DATABASE_PASSWORD_PLACEHOLDER}"
#   redis-password: "${REDIS_PASSWORD_PLACEHOLDER}"
#   default-admin-password: "${DEFAULT_ADMIN_PASSWORD_PLACEHOLDER}"
#   csrf-secret: "${CSRF_SECRET_PLACEHOLDER}"
