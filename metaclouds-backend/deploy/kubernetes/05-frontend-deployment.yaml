# ==============================================================================
# Metaclouds 前端 Deployment
# ==============================================================================
# Vue 3 + Vite 构建产物，由 nginx:alpine 托管。
# 2 副本，非 root 运行（nginx 用户 UID 101 + NET_BIND_SERVICE 绑定 80 端口）。
# nginx.conf 通过 ConfigMap 挂载（见 01-configmap.yaml 的 metaclouds-frontend-nginx）。
#
# 镜像 tag 通过 CI/CD 注入：kubectl set image deployment/metaclouds-frontend \
#   metaclouds-frontend=ghcr.io/customizedvalidation/yunchuang/frontend:${GIT_SHA}
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metaclouds-frontend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: frontend
    app.kubernetes.io/name: metaclouds-frontend
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: frontend
    app.kubernetes.io/managed-by: kustomize
  annotations:
    metaclouds.io/description: "Metaclouds 前端 SPA，nginx 托管静态资源 + /api 反向代理"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: metaclouds
      component: frontend
  template:
    metadata:
      labels:
        app: metaclouds
        component: frontend
        app.kubernetes.io/name: metaclouds-frontend
        app.kubernetes.io/part-of: metaclouds
        app.kubernetes.io/component: frontend
      annotations:
        metaclouds.io/config-checksum: "PLACEHOLDER"
    spec:
      serviceAccountName: metaclouds-frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: metaclouds
              component: frontend
      terminationGracePeriodSeconds: 30
      containers:
        - name: metaclouds-frontend
          # 镜像占位：CI 构建时注入真实 tag（如 git commit SHA）。
          # 生产禁止使用 latest tag。
          image: ghcr.io/customizedvalidation/yunchuang/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # ---- 健康检查 ----
          # startupProbe：nginx 启动快，给 30 秒上限
          startupProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 10
          # nginx /health 端点返回 200 ok（在 nginx.conf 中定义）
          livenessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              # 非 root 绑定 80 端口需要 NET_BIND_SERVICE
              add:
                - NET_BIND_SERVICE
              drop:
                - ALL
          # 挂载 nginx 配置 + 可写目录
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            # nginx 运行时需要可写的缓存 / PID / 临时目录
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 3 && nginx -s quit"]
      volumes:
        - name: nginx-config
          configMap:
            name: metaclouds-frontend-nginx
            items:
              - key: default.conf
                path: default.conf
        - name: nginx-cache
          emptyDir:
            sizeLimit: "100Mi"
        - name: nginx-run
          emptyDir:
            sizeLimit: "10Mi"
        - name: tmp
          emptyDir:
            sizeLimit: "50Mi"
