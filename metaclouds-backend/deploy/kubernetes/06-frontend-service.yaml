# ==============================================================================
# Metaclouds 前端 Service
# ==============================================================================
# ClusterIP 类型，仅在集群内部可访问。外部流量经 Ingress 进入。
# 端口 80 → 容器 80（nginx 以非 root + NET_BIND_SERVICE 绑定 80 端口）。
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: metaclouds-frontend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: frontend
    app.kubernetes.io/name: metaclouds-frontend
    app.kubernetes.io/part-of: metaclouds
    app.kubernetes.io/component: frontend
  annotations:
    metaclouds.io/description: "前端静态资源服务，ClusterIP 仅集群内访问"
spec:
  type: ClusterIP
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  selector:
    app: metaclouds
    component: frontend
