# ==============================================================================
# Metaclouds Kubernetes Secret 配置（fail-secure 模板）
# ==============================================================================
# 此文件已迁移至 02-secrets.yaml，内容保持一致。
# Kustomize 部署通过 02-secrets.yaml 引用；此文件保留用于向后兼容
# （backup-cronjob.yaml 等旧脚本可能直接引用此文件名）。
#
# ⚠️  安全警告：本文件是「模板」，不含任何真实密钥值。data 字段刻意留空，
#     直接 kubectl apply 会得到空 Secret，应用因读不到密钥而拒绝启动
#     （fail-secure），从而强制你在部署前先生成真实密钥。
#
# 生成真实 Secret：
#   kubectl -n metaclouds create secret generic metaclouds-secrets \
#     --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#     --from-literal=database-password="$(openssl rand -base64 24)" \
#     --from-literal=redis-password="$(openssl rand -base64 24)" \
#     --from-literal=default-admin-password="$(openssl rand -base64 18)" \
#     --from-literal=csrf-secret="$(openssl rand -base64 32)"
#
# 生产环境强烈推荐 Sealed Secrets / External Secrets Operator。
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: metaclouds-secrets
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    metaclouds.io/managed-by: "template"
    metaclouds.io/rotation-policy: "90d"
type: Opaque
data: {}
