# ==============================================================================
# Metaclouds Kubernetes Secret 配置（模板）
# ==============================================================================
# ⚠️ 安全警告：本文件是「模板」，不含任何真实密钥值。请勿直接 kubectl apply 后用
#    其中的占位值作为生产密钥——那样会得到可猜测的弱口令，等于把凭据写进 Git。
#
# 生成并创建真实 Secret 的正确方式（任选其一）：
#   1) 使用仓库脚本（推荐）：从已轮换的 .env.production 读取，不提交任何密钥。
#        在仓库根目录执行： ./deploy/generate_k8s_secrets.sh
#      脚本位于 deploy/generate_k8s_secrets.sh，读取 SECURE_JWT_SECRET /
#      SECURE_DEFAULT_ADMIN_PASSWORD / SECURE_DATABASE_PASSWORD（可选 SECURE_REDIS_PASSWORD）。
#   2) 手动创建：
#        kubectl -n metaclouds create secret generic metaclouds-secrets \
#          --from-literal=jwt-secret="$(openssl rand -base64 48)" \
#          --from-literal=default-admin-password="$(openssl rand -base64 18)" \
#          --from-literal=database-password="$(openssl rand -base64 18)"
#   3) 生产环境强烈建议改用 Sealed Secrets / External Secrets Operator，将密钥
#      托管在集群外，避免任何明文进入 Git 仓库。
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: metaclouds-secrets
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
type: Opaque
# 真实密钥请勿写入此文件。请用上方 generate_k8s_secrets.sh 或 kubectl create secret 生成。
# 本模板刻意不含 data/stringData：直接 kubectl apply 会得到「空 Secret」，应用会因读不到
# 密钥而拒绝启动（fail-secure），从而强制你在部署前先生成真实密钥。

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metaclouds-config
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
type: Opaque
data:
  # 服务器配置
  server-port: "8000"
  server-host: "0.0.0.0"
  server-env: "production"

  # CORS 配置（Base64 编码）
  allowed-origins: "aHR0cHM6Ly95b3VyZG9tYWluLmNvbSxodHRwczovL2FwcC55b3VyZG9tYWluLmNvbQ=="

  # 数据库配置
  use-sqlite: "false"
  memory-store-enabled: "false"
  database-host: "postgresql.metaclouds.svc.cluster.local"
  database-port: "5432"
  database-name: "metaclouds"
  database-user: "metaclouds_user"
  database-ssl-mode: "require"

  # Redis 配置
  redis-enabled: "true"
  redis-host: "redis.metaclouds.svc.cluster.local"
  redis-port: "6379"
  redis-db: "0"

  # 日志配置
  log-level: "warn"
  log-format: "json"
  log-output: "file"
  log-path: "/var/log/metaclouds/backend.log"

  # 限流配置
  rate-limit-enabled: "true"
  rate-limit-requests: "1000"
  rate-limit-duration-seconds: "60"

  # 熔断器配置
  circuit-breaker-enabled: "true"
  circuit-breaker-threshold: "50"
  circuit-breaker-timeout-seconds: "30"

  # 监控配置
  prometheus-enabled: "true"
  metrics-collection-interval: "15"

  # 超时配置
  read-timeout-seconds: "30"
  write-timeout-seconds: "60"
  idle-timeout-seconds: "120"
  max-request-body-size: "10485760"

---
# Role 和 RoleBinding 用于访问 Secret
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metaclouds-secrets-reader
  namespace: metaclouds
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["metaclouds-secrets"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metaclouds-secrets-reader-binding
  namespace: metaclouds
subjects:
- kind: ServiceAccount
  name: metaclouds-backend
  namespace: metaclouds
roleRef:
  kind: Role
  name: metaclouds-secrets-reader
  apiGroup: rbac.authorization.k8s.io
