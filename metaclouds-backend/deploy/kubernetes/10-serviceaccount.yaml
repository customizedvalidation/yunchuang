# ==============================================================================
# Metaclouds ServiceAccount / RBAC
# ==============================================================================
# 为后端和前端创建专用 ServiceAccount，不使用 default（最小权限原则）。
# 后端需要访问 K8s API 进行作业调度（创建 Job / 查看 Pod 日志 / exec）。
#
# 若使用 Workload Identity（GKE / EKS IRSA / AAD Pod Identity），
# 在 ServiceAccount 的 annotations 中添加云厂商身份注解。
# ==============================================================================

---
# ============================================================================
# 1. 后端 ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metaclouds-backend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    # Workload Identity 占位（按云厂商取消注释并填写）
    # GKE:
    # iam.gke.io/gcp-service-account: "metaclouds-backend@your-project.iam.gserviceaccount.com"
    # EKS IRSA:
    # eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/metaclouds-backend-role"
    # AKS AAD Pod Identity:
    # aadpodidbinding: "metaclouds-backend-identity"
    metaclouds.io/description: "后端服务账户，用于 K8s 作业调度与 Pod 管理"

---
# ============================================================================
# 2. 前端 ServiceAccount
# ============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metaclouds-frontend
  namespace: metaclouds
  labels:
    app: metaclouds
    component: frontend
    app.kubernetes.io/part-of: metaclouds
  annotations:
    metaclouds.io/description: "前端服务账户（静态资源托管，无需 K8s API 权限）"

---
# ============================================================================
# 3. 后端 Role：允许在 metaclouds 命名空间内进行作业调度
# ============================================================================
# 权限范围：
#   - pods: get/list/watch（查看作业 Pod 状态）
#   - pods/log: get（查看作业日志）
#   - pods/exec: create（进入作业容器调试）
#   - jobs: get/list/watch/create/delete（管理训练/推理作业）
#   - events: get/list/watch（查看作业事件）
#   - configmaps: get/list/watch（读取作业配置）
#   - secrets: get（仅读取 metaclouds-secrets，已在旧模板中定义）
#
# 注意：不授予 pods/create 或 pods/delete（作业通过 Job 资源管理，
# 不直接创建/删除 Pod），遵循最小权限原则。
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metaclouds-backend-scheduler
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["metaclouds-secrets"]
    verbs: ["get"]
  # 作业可能需要创建临时 ConfigMap 传递配置
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  # 作业可能需要创建 ServiceAccount（如需隔离作业权限）
  # - apiGroups: [""]
  #   resources: ["serviceaccounts"]
  #   verbs: ["get", "list", "watch"]

---
# ============================================================================
# 4. 后端 RoleBinding：将 scheduler Role 绑定到 metaclouds-backend SA
# ============================================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metaclouds-backend-scheduler-binding
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
    app.kubernetes.io/part-of: metaclouds
subjects:
  - kind: ServiceAccount
    name: metaclouds-backend
    namespace: metaclouds
roleRef:
  kind: Role
  name: metaclouds-backend-scheduler
  apiGroup: rbac.authorization.k8s.io
