# ==============================================================================
# Metaclouds NetworkPolicy
# ==============================================================================
# 默认拒绝所有入站/出站流量，仅放行显式声明的通信路径。
# 前置条件：集群 CNI 必须支持 NetworkPolicy（如 Calico / Cilium / Flannel + NetworkPolicy）。
#
# 通信矩阵：
#   ingress-nginx → frontend:80, backend:8080
#   frontend      → backend:8080（nginx /api 反代）
#   backend       → postgresql:5432, redis:6379, etcd:2379
#   backend       → jaeger:14268, prometheus:9090, kube-apiserver:443
#   all pods      → kube-dns:53 (UDP/TCP)
# ==============================================================================

---
# ============================================================================
# 1. 默认拒绝：命名空间内所有 Pod 的所有入站/出站流量
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-default-deny
  namespace: metaclouds
  labels:
    app: metaclouds
    app.kubernetes.io/part-of: metaclouds
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  # 空规则 = 拒绝所有（默认拒绝策略）

---
# ============================================================================
# 2. 后端 NetworkPolicy
# ============================================================================
# 入站：允许来自 ingress-nginx 和 frontend 的流量
# 出站：允许到 PostgreSQL / Redis / etcd / Jaeger / Prometheus / K8s API / DNS
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-backend-policy
  namespace: metaclouds
  labels:
    app: metaclouds
    component: backend
spec:
  podSelector:
    matchLabels:
      app: metaclouds
      component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 来自 ingress-nginx controller 的流量（8080 端口）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
    # 来自 frontend Pod 的流量（nginx /api 反代到 backend）
    - from:
        - podSelector:
            matchLabels:
              app: metaclouds
              component: frontend
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # → PostgreSQL（5432）
    - to:
        - podSelector:
            matchLabels:
              app: postgresql
      ports:
        - protocol: TCP
          port: 5432
    # → Redis（6379）
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    # → etcd（2379，配置中心）
    - to:
        - podSelector:
            matchLabels:
              app: etcd
      ports:
        - protocol: TCP
          port: 2379
    # → Jaeger collector（14268 Jaeger thrift / 4317 OTLP）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 14268
        - protocol: TCP
          port: 4317
    # → Prometheus（9090，后端内部查询指标）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    # → K8s API Server（443，作业调度 / Pod 管理）
    # 自托管集群：kube-system 中 component=kube-apiserver 的 Pod
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              component: kube-apiserver
      ports:
        - protocol: TCP
          port: 443
    # 托管集群（EKS/GKE/AKS）API Server 不可见，需用 ipBlock 放行：
    # - to:
    #     - ipBlock:
    #         cidr: 10.96.0.1/32   # kubernetes service ClusterIP，按实际集群调整
    #   ports:
    #     - protocol: TCP
    #       port: 443
    # → DNS（kube-dns / CoreDNS，53 UDP + TCP）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ============================================================================
# 3. 前端 NetworkPolicy
# ============================================================================
# 入站：允许来自 ingress-nginx 的流量
# 出站：允许到 backend（/api 反代）和 DNS
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-frontend-policy
  namespace: metaclouds
  labels:
    app: metaclouds
    component: frontend
spec:
  podSelector:
    matchLabels:
      app: metaclouds
      component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 来自 ingress-nginx controller 的流量（80 端口）
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
  egress:
    # → backend（8080，nginx /api 反代）
    - to:
        - podSelector:
            matchLabels:
              app: metaclouds
              component: backend
      ports:
        - protocol: TCP
          port: 8080
    # → DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# ============================================================================
# 4. 中间件 NetworkPolicy（PostgreSQL / Redis / etcd）
# ============================================================================
# 入站：仅允许来自 backend 的流量
# 出站：DNS（如需外部备份 / 复制）
# ============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metaclouds-middleware-policy
  namespace: metaclouds
  labels:
    app: metaclouds
    component: middleware
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - postgresql
          - redis
          - etcd
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 仅允许来自 backend 的入站
    - from:
        - podSelector:
            matchLabels:
              app: metaclouds
              component: backend
      ports:
        - protocol: TCP
          port: 5432  # PostgreSQL
        - protocol: TCP
          port: 6379  # Redis
        - protocol: TCP
          port: 2379  # etcd
  egress:
    # → DNS（PostgreSQL 可能需要解析备份目标 / 复制源）
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
