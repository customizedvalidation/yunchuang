events {
    worker_connections 1024;
}

http {
    upstream backend {
        least_conn;
        
        server app-1:8000 weight=1 max_fails=3 fail_timeout=30s;
        server app-2:8000 weight=1 max_fails=3 fail_timeout=30s;
        server app-3:8000 weight=1 max_fails=3 fail_timeout=30s;
        
        keepalive 32;
    }

    upstream metrics {
        least_conn;
        
        server app-1:8000 weight=1;
        server app-2:8000 weight=1;
        server app-3:8000 weight=1;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m 
                     max_size=100m inactive=60m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /api/ {
            proxy_pass http://backend;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            
            add_header X-Upstream-Instance $upstream_http_x_instance_id always;
        }

        location /metrics {
            proxy_pass http://metrics/metrics;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            proxy_http_version 1.1;
            proxy_buffering off;
            
            add_header X-Upstream-Instance $upstream_http_x_instance_id always;
        }

        location /swagger/ {
            proxy_pass http://backend/swagger/;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            proxy_cache api_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
        }

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
