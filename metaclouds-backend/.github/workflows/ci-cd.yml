name: Metaclouds CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      log_level:
        description: 'Log level for deployment'
        required: true
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR

env:
  GO_VERSION: '1.24'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MIN_TEST_COVERAGE: 70

jobs:
  security-scan:
    name: Security Pre-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run checkov for Infrastructure as Code scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          soft_fail: true

      - name: Detect secrets
        uses: IBM/secrets-detection-action@v1.1.1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          scanType: all

  build:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    needs: security-scan
    env:
      LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Install dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v -o metaclouds-backend .
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}

      - name: Run unit tests
        run: go test -v ./services/... ./pkg/... ./models/... -timeout 60s
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test
          PROMETHEUS_ENABLED: false

      - name: Run monitoring service tests with coverage
        run: |
          go test -v -coverprofile=monitoring_coverage.out -covermode=atomic ./services/ -run TestMonitoring -timeout 60s
          go tool cover -func=monitoring_coverage.out | grep monitoring_service | awk '{print $3}' | while read coverage; do
            echo "Monitoring Service Coverage: $coverage"
            percentage=$(echo "$coverage" | sed 's/%//')
            if (( $(echo "$percentage < 60" | bc -l) )); then
              echo "Error: Monitoring service coverage ($coverage) is below 60%"
              exit 1
            fi
          done
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test
          PROMETHEUS_ENABLED: false

      - name: Run integration tests
        run: go test -v ./tests/... -timeout 120s
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test
          PROMETHEUS_ENABLED: false

      - name: Run middleware tests
        run: go test -v ./middlewares/... -timeout 60s
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      - name: Security scan with gosec
        uses: securecodewarrior/gosec-action@v1
        with:
          args: '-fmt sarif -out results.sarif ./...'
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        if: success() || failure()

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:go"

      - name: Test coverage
        run: go test -coverprofile=coverage.out ./...
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test

      - name: Check overall coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total Coverage: ${coverage}%"
          if (( $(echo "$coverage < $MIN_TEST_COVERAGE" | bc -l) )); then
            echo "Error: Test coverage ($coverage%) is below minimum required ($MIN_TEST_COVERAGE%)"
            exit 1
          fi

      - name: Verify configuration
        run: |
          if [ ! -f ".env.production" ]; then
            echo "Error: .env.production file not found"
            exit 1
          fi
          grep -q "JWT_SECRET=" .env.production || (echo "Error: JWT_SECRET not set in .env.production" && exit 1)
          grep -q "DATABASE_PASSWORD=" .env.production || (echo "Error: DATABASE_PASSWORD not set in .env.production" && exit 1)

      - name: Generate CI report
        run: |
          chmod +x scripts/generate_ci_report.sh
          scripts/generate_ci_report.sh
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}

      - name: Upload CI report artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: docs/CI_PIPELINE_REPORT_*.md

  docker-build:
    name: Build Docker Image
    needs: build
    if: github.event_name == 'push' || github.event.inputs.environment != ''
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LOG_LEVEL=${{ env.LOG_LEVEL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        if: success() || failure()

  deploy-development:
    name: Deploy to Development
    needs: docker-build
    if: github.ref == 'refs/heads/develop' || (github.event.inputs.environment == 'development' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: development
      url: http://dev.metaclouds.example.com
    env:
      LOG_LEVEL: DEBUG
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Development
        run: |
          echo "Deploying to Development environment with LOG_LEVEL=${{ env.LOG_LEVEL }}"
          echo "Running deployment script..."
          ./deploy.sh -e development -l ${{ env.LOG_LEVEL }}
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}

      - name: Verify Development deployment
        run: |
          echo "Verifying development deployment..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://dev.metaclouds.example.com/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Error: Health check failed with status $STATUS"
            exit 1
          fi

      - name: Validate API endpoints
        run: |
          echo "Validating API endpoints..."
          curl -s -f http://dev.metaclouds.example.com/api/v1/clusters || exit 1
          echo "API validation successful"

  deploy-staging:
    name: Deploy to Staging
    needs: docker-build
    if: github.ref == 'refs/heads/main' || (github.event.inputs.environment == 'staging' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://staging.metaclouds.example.com
    env:
      LOG_LEVEL: INFO
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging environment with LOG_LEVEL=${{ env.LOG_LEVEL }}"
          echo "Running deployment script..."
          ./deploy.sh -e staging -l ${{ env.LOG_LEVEL }}
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}

      - name: Verify Staging deployment
        run: |
          echo "Verifying staging deployment..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://staging.metaclouds.example.com/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Error: Health check failed with status $STATUS"
            exit 1
          fi

      - name: Validate API endpoints
        run: |
          echo "Validating API endpoints..."
          curl -s -f http://staging.metaclouds.example.com/api/v1/clusters || exit 1
          curl -s -f http://staging.metaclouds.example.com/api/v1/jobs || exit 1
          echo "API validation successful"

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          go test -v -run TestSmoke ./tests/... -timeout 30s
        env:
          ENVIRONMENT: staging

  production-approval:
    name: Production Approval Gate
    needs: [deploy-staging]
    if: github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.metaclouds.example.com
      required_approvers:
        users:
          - admin
    steps:
      - name: Approval Gate
        run: echo "Production deployment approved"

  deploy-production:
    name: Deploy to Production
    needs: [production-approval]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.metaclouds.example.com
    env:
      LOG_LEVEL: WARN
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          echo "Deploying to Production environment with LOG_LEVEL=${{ env.LOG_LEVEL }}"
          echo "Running deployment script..."
          ./deploy.sh -e production -l ${{ env.LOG_LEVEL }}
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}

      - name: Verify Production deployment
        run: |
          echo "Verifying production deployment..."
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api.metaclouds.example.com/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Error: Health check failed with status $STATUS"
            exit 1
          fi

      - name: Validate API endpoints
        run: |
          echo "Validating API endpoints..."
          curl -s -f https://api.metaclouds.example.com/api/v1/clusters || exit 1
          curl -s -f https://api.metaclouds.example.com/api/v1/jobs || exit 1
          echo "API validation successful"

      - name: Record deployment
        run: |
          echo "Recording deployment..."
          echo "Deployment successful at $(date) with commit ${{ github.sha }}"

  verify-deployment:
    name: Comprehensive Deployment Verification
    needs: [deploy-development, deploy-staging, deploy-production]
    if: always()
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: INFO
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install dependencies
        run: go mod download

      - name: Run E2E validation tests
        run: go test -v ./tests/e2e_test.go -run TestE2E -timeout 120s
        env:
          PORT_UTILS_LOG_LEVEL: ${{ env.LOG_LEVEL }}
          ENVIRONMENT: test
          PROMETHEUS_ENABLED: false

      - name: Verify health endpoints
        run: |
          echo "=== Deployment Verification Summary ==="
          DEV_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://dev.metaclouds.example.com/health 2>/dev/null || echo 'N/A')
          STAGING_STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://staging.metaclouds.example.com/health 2>/dev/null || echo 'N/A')
          PROD_STATUS=$(curl -s -o /dev/null -w '%{http_code}' https://api.metaclouds.example.com/health 2>/dev/null || echo 'N/A')
          echo "Development: $DEV_STATUS"
          echo "Staging: $STAGING_STATUS"
          echo "Production: $PROD_STATUS"
          
          if [ "$DEV_STATUS" != "200" ] && [ "$DEV_STATUS" != "N/A" ]; then
            echo "Error: Development health check failed"
            exit 1
          fi
          if [ "$STAGING_STATUS" != "200" ] && [ "$STAGING_STATUS" != "N/A" ]; then
            echo "Error: Staging health check failed"
            exit 1
          fi
          if [ "$PROD_STATUS" != "200" ] && [ "$PROD_STATUS" != "N/A" ]; then
            echo "Error: Production health check failed"
            exit 1
          fi