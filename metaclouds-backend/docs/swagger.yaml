    get:
      tags: [health]
      summary: 健康检查
      description: |
        检查服务健康状态。只有全部已注册依赖探针（数据库、缓存等）通过时才返回 200。
        支持 Accept: text/html 返回 HTML 页面。
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: 服务不健康（依赖探针失败）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /metrics:
    get:
      tags: [health]
      summary: Prometheus 指标端点
      description: 暴露 Prometheus 格式的运行时指标和业务指标，供 Prometheus 采集。
      responses:
        '200':
          description: Prometheus 指标文本
          content:
            text/plain:
              schema:
                type: string
