openapi: "3.0.0"
info:
  version: 1.0.0
  title: Metaclouds Backend API
  description: |
    Metaclouds AI 算力调度平台后端 API 文档。

    ## 认证方式
    - **JWT Bearer**：在 `Authorization` 头中携带 `Bearer <token>`，适用于非浏览器客户端。
    - **HttpOnly Cookie**：登录后服务端设置 `access_token` Cookie（httpOnly），浏览器自动携带。
    - **CSRF 防护**：使用 Cookie 认证时，状态变更请求（POST/PUT/DELETE）必须在 `X-CSRF-Token` 头中携带与 `csrf_token` Cookie 一致的令牌。

    ## 统一响应格式
    所有 API 响应遵循统一包装结构：
    ```json
    {
      "success": true,
      "data": { ... },
      "message": "操作成功",
      "code": "OK",
      "timestamp": 1757200000
    }
    ```

    ## 分页规范
    列表接口支持 `page`（默认 1）和 `page_size`（默认 10，最大 100）查询参数。
  contact:
    name: Metaclouds Team
    email: support@metaclouds.com
servers:
  - url: http://localhost:8000/api/v1
    description: Development server
  - url: https://api.metaclouds.com/api/v1
    description: Production server

tags:
  - name: auth
    description: 认证与用户管理
  - name: cluster
    description: 集群管理
  - name: resource
    description: 资源管理
  - name: job
    description: 作业管理
  - name: k8s
    description: Kubernetes 集成
  - name: monitoring
    description: 监控与告警
  - name: tenant
    description: 租户管理
  - name: acceleration
    description: 加速套件管理
  - name: security
    description: 安全策略管理
  - name: health
    description: 健康检查与指标

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer 认证，适用于非浏览器客户端
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly Cookie 认证，浏览器登录后自动携带

  schemas:
    # ===== 通用响应 =====
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 请求是否成功
        data:
          description: 响应数据（具体类型由接口决定）
        message:
          type: string
          description: 提示信息
        code:
          type: string
          description: 业务状态码
        timestamp:
          type: integer
          format: int64
          description: 响应时间戳（Unix 秒）

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: 错误信息
        code:
          type: string
          description: 错误码
        timestamp:
          type: integer
          format: int64

    PaginatedData:
      type: object
      properties:
        data:
          type: array
          items: {}
          description: 数据列表
        total:
          type: integer
          description: 总记录数
        page:
          type: integer
          description: 当前页码
        page_size:
          type: integer
          description: 每页条数
        total_pages:
          type: integer
          description: 总页数

    # ===== 用户 =====
    User:
      type: object
      properties:
        id:
          type: integer
          format: uint
        username:
          type: string
        email:
          type: string
        role:
          type: string
          description: 用户角色（admin/user）
        tenant_id:
          type: integer
          format: uint
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT 访问令牌
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: integer
          format: int64
          description: 令牌过期时间戳

    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 6

    CSRFResponse:
      type: object
      properties:
        csrf_token:
          type: string
          description: CSRF 双提交令牌

    # ===== 集群 =====
    Cluster:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: 集群状态（active/inactive/maintenance）
        nodes:
          type: integer
          description: 节点数
        gpus:
          type: integer
          description: GPU 总数
        cpus:
          type: integer
          description: CPU 核数
        memory:
          type: integer
          description: 内存（GB）
        storage:
          type: integer
          description: 存储（TB）
        network_type:
          type: string
        location:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClusterCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        nodes:
          type: integer
        gpus:
          type: integer
        cpus:
          type: integer
        memory:
          type: integer
        storage:
          type: integer
        network_type:
          type: string
        location:
          type: string

    ClusterUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        nodes:
          type: integer
        gpus:
          type: integer
        cpus:
          type: integer
        memory:
          type: integer
        storage:
          type: integer
        network_type:
          type: string
        location:
          type: string

    ClusterStatus:
      type: object
      properties:
        cluster_id:
          type: integer
          format: uint
        status:
          type: string
        nodes_ready:
          type: integer
        nodes_total:
          type: integer
        gpus_available:
          type: integer
        gpus_allocated:
          type: integer
        cpu_usage_percent:
          type: number
          format: float
        memory_usage_percent:
          type: number
          format: float

    # ===== 资源 =====
    Resource:
      type: object
      properties:
        id:
          type: integer
          format: uint
        cluster_id:
          type: integer
          format: uint
        type:
          type: string
          description: 资源类型（gpu/cpu/memory/storage/network）
        name:
          type: string
        status:
          type: string
          description: 资源状态（available/allocated/maintenance）
        total:
          type: integer
        used:
          type: integer
        available:
          type: integer
        utilization:
          type: number
          format: float
          description: 利用率百分比
        details:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResourceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        total:
          type: integer
        used:
          type: integer
        details:
          type: string

    GPUResource:
      type: object
      properties:
        cluster_id:
          type: integer
          format: uint
        node_id:
          type: string
        gpu_id:
          type: string
        name:
          type: string
        total_memory_bytes:
          type: integer
          format: int64
        used_memory_bytes:
          type: integer
          format: int64
        utilization_percent:
          type: number
          format: float
        temperature:
          type: number
          format: float
        power_watts:
          type: number
          format: float

    # ===== 作业 =====
    Job:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: 作业状态（pending/running/completed/failed/cancelled）
        type:
          type: string
          description: 作业类型（training/inference/batch）
        priority:
          type: integer
          description: 优先级（0=low, 1=medium, 2=high, 3=critical）
        progress:
          type: integer
          description: 进度百分比（0-100）
        cluster_id:
          type: integer
          format: uint
        tenant_id:
          type: integer
          format: uint
        user_id:
          type: integer
          format: uint
        gpus:
          type: integer
        cpus:
          type: integer
        memory:
          type: integer
          description: 内存（GB）
        duration:
          type: integer
          description: 预计运行时间（分钟）
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        output_path:
          type: string
        error_msg:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    JobCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        priority:
          type: integer
          minimum: 0
          maximum: 3
        gpus:
          type: integer
          minimum: 0
        cpus:
          type: integer
          minimum: 0
        memory:
          type: integer
          minimum: 0
        duration:
          type: integer
          minimum: 0
        cluster_id:
          type: integer
          format: uint
        tenant_id:
          type: integer
          format: uint
        user_id:
          type: integer
          format: uint

    JobUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        priority:
          type: integer
        progress:
          type: integer
        output_path:
          type: string
        error_msg:
          type: string

    JobStatus:
      type: object
      properties:
        job_id:
          type: integer
          format: uint
        status:
          type: string
        progress:
          type: integer
        start_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        pod_name:
          type: string
        pod_status:
          type: string
        error_msg:
          type: string

    # ===== 监控 =====
    MonitoringMetrics:
      type: object
      properties:
        cpu:
          type: object
          properties:
            usage:
              type: number
              format: float
            total:
              type: integer
        memory:
          type: object
          properties:
            usage:
              type: number
              format: float
            total_bytes:
              type: integer
              format: int64
        gpu:
          type: object
          properties:
            usage:
              type: number
              format: float
            memory_usage:
              type: number
              format: float
            available:
              type: number
              format: float
        jobs:
          type: object
          properties:
            running:
              type: integer
            pending:
              type: integer
            completed:
              type: integer
            failed:
              type: integer

    Alert:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        severity:
          type: string
          description: 严重级别（critical/warning/info）
        status:
          type: string
          description: 状态（firing/resolved）
        message:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    # ===== 租户 =====
    Tenant:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        status:
          type: string
          description: 租户状态（active/inactive/suspended）
        gpu_quota:
          type: integer
        cpu_quota:
          type: integer
        memory_quota:
          type: integer
          description: 内存配额（GB）
        storage_quota:
          type: integer
          description: 存储配额（TB）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TenantCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        gpu_quota:
          type: integer
        cpu_quota:
          type: integer
        memory_quota:
          type: integer
        storage_quota:
          type: integer

    TenantUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
        gpu_quota:
          type: integer
        cpu_quota:
          type: integer
        memory_quota:
          type: integer
        storage_quota:
          type: integer

    # ===== 加速套件 =====
    AccelerationSuite:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: 加速类型（data/training/inference）
        version:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        details:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AccelerationSuiteCreateRequest:
      type: object
      required:
        - name
        - type
        - version
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        version:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        details:
          type: string

    AccelerationSuiteUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        version:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        details:
          type: string

    # ===== 安全策略 =====
    SecurityPolicy:
      type: object
      properties:
        id:
          type: integer
          format: uint
        name:
          type: string
        description:
          type: string
        type:
          type: string
          description: 策略类型（access/network/data/system）
        status:
          type: string
        enabled:
          type: boolean
        rules:
          type: string
          description: JSON 格式的规则定义
        details:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecurityPolicyCreateRequest:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        rules:
          type: string
        details:
          type: string

    SecurityPolicyUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        status:
          type: string
        enabled:
          type: boolean
        rules:
          type: string
        details:
          type: string

    # ===== 健康检查 =====
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          description: 健康状态（healthy/unhealthy）
        timestamp:
          type: integer
          format: int64
        dependencies:
          type: integer
          description: 已注册的依赖探针数量

paths:
  # ========================================================================
  # 认证
  # ========================================================================
  /auth/login:
    post:
      tags: [auth]
      summary: 用户登录
      description: 验证用户名和密码，返回 JWT 令牌并设置 httpOnly Cookie。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 认证失败（用户名或密码错误）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 登录失败次数过多，账户临时锁定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [auth]
      summary: 用户登出
      description: 清除客户端的 access_token 和 csrf_token Cookie，幂等操作无需鉴权。
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/csrf:
    get:
      tags: [auth]
      summary: 获取 CSRF 令牌
      description: 返回当前会话的 CSRF 双提交令牌，用于跨域部署下前端 JS 无法读取 Cookie 的场景。
      responses:
        '200':
          description: CSRF 令牌
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CSRFResponse'
        '401':
          description: 未登录（无 csrf_token Cookie）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 刷新 JWT 令牌
      description: 使用当前有效 JWT 换取新的令牌，延长会话有效期。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: 令牌刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 未认证或令牌已过期
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/profile:
    get:
      tags: [auth]
      summary: 获取当前用户资料
      description: 返回当前登录用户的详细信息，数据取自数据库而非 JWT claims。
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        '200':
          description: 用户资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/register:
    post:
      tags: [auth]
      summary: 用户注册
      description: |
        创建新用户账号。默认关闭公开注册（需 ALLOW_PUBLIC_REGISTRATION=true），
        关闭时返回 404。自注册账号一律赋予 user 角色。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 用户创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: 请求参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 注册功能未启用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ========================================================================
  # 集群管理
  # ========================================================================
  /clusters:
    get:
      tags: [cluster]
      summary: 获取集群列表
      description: 返回所有已注册的集群。
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 10
            maximum: 100
      responses:
        '200':
          description: 集群列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Cluster'
        '401':
          description: 未认证
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 服务器内部错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [cluster]
      summary: 创建集群
      description: 注册新的计算集群。需要 cluster_write 权限。
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '201':
          description: 集群创建成功
          content:
            application/json:
              schema:
                allOf:
