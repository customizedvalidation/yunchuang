# ==============================================================================
# Metaclouds Frontend (Vue 3) nginx 配置
# - SPA history 路由回退
# - 静态资源（带 hash 的 js/css/字体/图片）长缓存
# - index.html 不缓存，确保发版即时生效
# /api 反向代理：
#   - compose/单机场景：由本层转发到 backend 服务（服务名 backend:8000），
#     否则浏览器直连 :8080 时 /api/v1/* 会被下面的 SPA 回退吞成 index.html。
#   - K8s 场景：/api 由 Ingress 先行路由到后端 Service，本 location 不会被命中。
# ==============================================================================

# 安全响应头片段（nginx 的 add_header 子块会覆盖父块，故用 include 保证各 location 均生效）
# 文件随镜像一起分发，见 Dockerfile 的 conf.d 拷贝。

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（默认继承给未自定义 add_header 的 location）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 带内容 hash 的静态资源长缓存（Vite 产物在 assets/ 下）
    # 注意：nginx 中子块一旦使用 add_header 即不再继承父块，故此处重复安全头
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # 常见静态文件扩展名长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证部署后立即拿到最新版本
    # HTML 是注入/劫持的主要入口，安全头全套下发
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'self'" always;
        expires off;
    }

    # ==========================================================================
    # 后端 API 反向代理（compose / 单机部署场景）
    # K8s 场景由 Ingress 先行分流 /api，此块不会被命中。
    # ==========================================================================
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端是事件驱动服务，无需 SSE 长连接支持；保留默认 60s 读超时
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 健康检查端点（K8s livenessProbe/readinessProbe 探测，返回 200 空响应）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA 路由回退：未命中静态资源时交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
