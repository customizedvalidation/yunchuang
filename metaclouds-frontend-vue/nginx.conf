# ==============================================================================
# Metaclouds Frontend (Vue 3) nginx 配置
# - SPA history 路由回退
# - 静态资源（带 hash 的 js/css/字体/图片）长缓存
# - index.html 不缓存，确保发版即时生效
# 生产环境 /api 通常由 Kubernetes Ingress 处理，此处不做反向代理
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 带内容 hash 的静态资源长缓存（Vite 产物在 assets/ 下）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 常见静态文件扩展名长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # index.html 不缓存，保证部署后立即拿到最新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA 路由回退：未命中静态资源时交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
