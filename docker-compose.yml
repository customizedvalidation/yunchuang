
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metaclouds-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, see .env.example}
    # 仅绑定回环：数据库/缓存/中间件一律不暴露到宿主机网卡，避免未授权直连。
    # 需要本地调试时改用 ssh -L 或 docker exec，勿改成 0.0.0.0。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - metaclouds-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: metaclouds-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 用容器内环境变量而非明文口令，避免凭据出现在 `docker inspect`
      # 的 healthcheck 定义里。
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - metaclouds-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: metaclouds-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - metaclouds-network
    restart: unless-stopped

  # prometheus.yml 的 alerting.alertmanagers 指向 alertmanager:9093；
  # 此前 compose 里没有这个服务，告警产生后无处投递（静默丢失）。
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: metaclouds-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - metaclouds-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.3
    container_name: metaclouds-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER is required, see .env.example}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required, see .env.example}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - metaclouds-network
    restart: unless-stopped

  etcd:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: metaclouds-etcd
    environment:
      - ETCD_NAME=metaclouds-etcd
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=metaclouds-etcd=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=metaclouds-cluster
    # etcd 无任何认证，务必只监听回环
    ports:
      - "127.0.0.1:2379:2379"
      - "127.0.0.1:2380:2380"
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - metaclouds-network
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: metaclouds-jaeger
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    ports:
      - "127.0.0.1:6831:6831/udp"
      - "127.0.0.1:6832:6832/udp"
      - "127.0.0.1:5778:5778"
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:14250:14250"
      - "127.0.0.1:14268:14268"
      - "127.0.0.1:14269:14269"
      - "127.0.0.1:9411:9411"
    networks:
      - metaclouds-network
    restart: unless-stopped

  # ============================================================================
  # 后端：Rust（Axum）——唯一主后端，构建上下文为 ./metaclouds-backend-rust。
  # 关键配置说明：
  #   - MEMORY_STORE_ENABLED=false  Rust 默认内存 sqlite，必须显式关闭才走 postgres。
  #   - REDIS_ENABLED=true          Rust 默认关闭 Redis，联调栈需显式开启。
  #   - 种子 admin 口令：seed_admin_if_empty 现读 DEFAULT_ADMIN_PASSWORD
  #     （bootstrap_password：env 已设且 ≥12 字符用 env；生产未设则 fail-secure
  #     拒播种并退出；非生产未设回退 Admin@123456，本地联调开箱可用）。
  #     生产请经 Secret / .env 注入强口令，seed 后改密或接 IdP。
  # 待目标环境 docker build 实测验证。
  #
  # ⚠️ 存储驱动（重要）：请求层 SQL 仍是 SQLite 方言（?N 占位符 /
  # last_insert_rowid），未移植到 Postgres。main.rs 对此是 fail-closed 的：
  # USE_SQLITE=false 会连上 PG、跑完迁移后立刻报错退出。因此本联调栈
  # 显式使用 SQLite 文件库，否则 backend 容器根本起不来。
  # 生产要切 PG，须先完成「请求层方言移植」里程碑（见 docs 复盘报告 P0）。
  # ============================================================================
  backend:
    build:
      context: ./metaclouds-backend-rust
      dockerfile: Dockerfile
    container_name: metaclouds-backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # SQLite 文件库持久化；改用 PG 后此卷可一并删除。
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - SERVER_ENV=${SERVER_ENV:-development}
      # 请求层方言未移植 → 走 SQLite 文件库（改 true 前先完成 PG 移植里程碑）
      - MEMORY_STORE_ENABLED=false
      - USE_SQLITE=true
      - DATABASE_URL=sqlite:///app/data/metaclouds.db
      # 以下 PG 变量在切到 Postgres 后生效，此处保留以便一键切换
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:?POSTGRES_USER is required, see .env.example}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      - DATABASE_NAME=${POSTGRES_DB:?POSTGRES_DB is required, see .env.example}
      - DATABASE_SSL_MODE=disable
      - REDIS_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required, see .env.example}
      - REDIS_DB=0
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required, see .env.example}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@123456}
      - JWT_EXPIRATION_HOURS=24
      - PROMETHEUS_ENABLED=true
      - PROMETHEUS_PORT=9090
      - MONITORING_ENABLED=true
      - ALERT_ENABLED=true
      - K8S_ENABLED=true
      - K8S_NAMESPACE=metaclouds
      - K8S_SIMULATION_MODE=true
      - SCHEDULER_ENABLED=true
      - SCHEDULER_INTERVAL_SECONDS=10
      - TRACING_ENABLED=true
      - TRACING_SERVICE_NAME=metaclouds-backend
      - JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    networks:
      - metaclouds-network
    restart: unless-stopped

  frontend:
    build:
      context: ./metaclouds-frontend-vue
      dockerfile: Dockerfile
    container_name: metaclouds-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - metaclouds-network
    restart: unless-stopped

volumes:
  backend_data:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  etcd_data:
  alertmanager_data:

networks:
  metaclouds-network:
    driver: bridge

