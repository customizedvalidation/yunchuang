global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 目标用 compose 服务名：prometheus 与 backend 同在 metaclouds-network，
  # 此前写 host.docker.internal 在 Linux 上缺少 extra_hosts 映射，解析必失败。
  - job_name: 'metaclouds-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # 原 'metaclouds-jobs' 抓取 /monitoring/metrics：该路径挂在 /api/v1 下需要 JWT，
  # Prometheus 无凭据必 401（同一份指标已在上面的 /metrics 全量暴露），故删除。

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - "alerts.yml"
