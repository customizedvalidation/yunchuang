# ==============================================================================
# Metaclouds CI/CD Pipeline (Monorepo)
# ==============================================================================
# 工作流已从 metaclouds-backend/.github/workflows/ 迁移至仓库根目录。
# 所有路径均为 monorepo 相对路径，通过 working-directory 切换子项目。
# 后端已全面迁移至 Rust（metaclouds-backend-rust），Go 旧架构已于 2026-09 退役。
#
# Job 依赖关系（2026-11-09 修订）：
#   security-scan ────────────────────────────┐（不再单点扇出：预扫描失败不会连锁跳过单测/构建）
#   frontend-test / rust-lint-test /           │
#   rust-test-postgres / rust-release-build ───┤
#   validate-k8s ──────────────────────────────┤
#                                              ├──> docker-build-* (needs 含 security-scan)
#                                              │      ├──> deploy-development / deploy-staging
#                                              │      └──> deploy-k8s (SHA 钉版本 + 真实断言)
#                                              └──> verify-deployment（仅 staging 成功后真实断言）
# 安全门禁、镜像扫描、部署后验证均以非 0 退出码表达失败，不再有恒绿占位步骤。
#
# 2026-11-09 第三轮（运维前置条件）：新增 deploy-prereqs 作为部署链路总闸。
#   deploy-prereqs ──> deploy-development / deploy-staging / deploy-production / deploy-k8s
#   未启用部署时这些 job 显示 skipped（既非绿也非红），主构建链路不受影响；
#   声明启用却缺配置时才由 preflight 明确变红。详见 docs/deployment-prerequisites.md。
# ==============================================================================

name: Metaclouds CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production
      log_level:
        description: 'Log level for deployment'
        required: true
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARN
          - ERROR

permissions:
  contents: read
  security-events: write
  actions: read
  # 推送镜像到 GHCR 必需：docker/login-action 用 GITHUB_TOKEN 登录 ghcr.io 时，
  # 缺少 packages: write 会被 401 拒绝，导致 build job 在 push 步骤失败。
  packages: write

env:
  NODE_VERSION: '22'
  DOCKER_REGISTRY: ghcr.io
  # ghcr 镜像名采用层级命名 ghcr.io/<owner>/<repo>/<image>，
  # 与 metaclouds-backend-rust/k8s/*.yaml（Deployment/kustomization/prod compose）
  # 的引用保持一致，避免扁平名 push 后 K8s 拉取镜像 ImagePullBackOff。
  RUST_BACKEND_IMAGE_NAME: ${{ github.repository }}/backend-rust
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # ============================================================================
  # Job 0: 部署前置条件总闸（2026-11-09 第三轮）
  #
  # 此前「推送前必须配齐运维变量」只是文档里的一张表，CI 侧由 4 个 deploy job
  # 各自手写 3 行 Guard：漏检 *_USER / DEPLOY_DIR / KUBE_CONFIG / K8s 真实凭据，
  # 只查非空不查格式（example.com 占位域名、假 SSH key、假 kubeconfig 都能通过），
  # 而且未配置就让整条流水线变红 —— 等于把"还没运维就绪"误报成"代码有问题"。
  #
  # 现在收敛到唯一真源 scripts/check-deploy-prereqs.sh，状态机为：
  #   DEPLOY_ENABLED != true            -> 部署 job 全部 skipped（主构建链路保持绿）
  #   DEPLOY_ENABLED=true 且前置条件不全 -> preflight exit 1（按设计变红，一次报全）
  #   DEPLOY_ENABLED=true 且齐全        -> 仅放行 DEPLOY_TARGETS 列出的目标
  # 任何配置值都不会被打印到日志（只输出变量名与检查结果）。
  # ============================================================================
  deploy-prereqs:
    name: Deployment Preflight
    runs-on: ubuntu-latest
    outputs:
      enabled:     ${{ steps.check.outputs.enabled }}
      development: ${{ steps.check.outputs.development }}
      staging:     ${{ steps.check.outputs.staging }}
      production:  ${{ steps.check.outputs.production }}
      k8s:         ${{ steps.check.outputs.k8s }}
    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
      DEPLOY_TARGETS: ${{ vars.DEPLOY_TARGETS }}
      DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      PROD_BASE_URL: ${{ vars.PROD_BASE_URL }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/metaclouds' }}
      K8S_BASE_URL: ${{ vars.K8S_BASE_URL }}
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      K8S_JWT_SECRET: ${{ secrets.K8S_JWT_SECRET }}
      K8S_DATABASE_URL: ${{ secrets.K8S_DATABASE_URL }}
      K8S_REDIS_PASSWORD: ${{ secrets.K8S_REDIS_PASSWORD }}
      K8S_DEFAULT_ADMIN_PASSWORD: ${{ secrets.K8S_DEFAULT_ADMIN_PASSWORD }}
      K8S_POSTGRES_PASSWORD: ${{ secrets.K8S_POSTGRES_PASSWORD }}
      K8S_PROTECTED_ENDPOINTS_TOKEN: ${{ secrets.K8S_PROTECTED_ENDPOINTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment prerequisites (single source of truth)
        id: check
        run: bash scripts/check-deploy-prereqs.sh --ci

      - name: Syntax-check deployment scripts and catalog
        run: |
          bash -n scripts/check-deploy-prereqs.sh
          bash -n scripts/render-k8s-secret.sh
          bash -n scripts/verify-deployment.sh
          bash scripts/check-deploy-prereqs.sh --list > /dev/null
          echo "deployment helper scripts syntax OK"

  # ============================================================================
  # Job 1: 安全预扫描（IaC + 密钥检测）
  # ============================================================================
  security-scan:
    name: Security Pre-Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run checkov for Infrastructure as Code scanning
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          # 生产分支对 HIGH/CRITICAL 阻断；设计使然的检查集中豁免（见下方注释）。
          # 新增违规会直接 fail CI，防止 IaC 安全回归合入 main。
          soft_fail: false
          quiet: true
          # 集中豁免（设计使然的检查，经评审确认可接受）：
          #  - CKV_K8S_35: secrets 经 env 注入是 K8s Secret 对象（RBAC 保护）+ 官方镜像
          #    entrypoint 契约（postgres/redis），非明文；文件挂载需改镜像契约，收益不匹配
          #  - CKV_K8S_40: runAsUser 为官方镜像固定 uid（nginx 101 / postgres 999），
          #    已配 runAsNonRoot + fsGroup + seccomp + drop ALL，host 冲突风险受控
          #  - CKV_K8S_43: 镜像 digest 由 CI 在 deploy 时以 GIT_SHA tag 注入（不可变），
          #    清单占位 tag 非最终值；静态扫描无法解析运行时注入
          #  - CKV_SECRET_4/6: 02-secret.yaml 与 docker-compose.yml 中的值均为
          #    base64 占位符（原文 CHANGEME-* / dev-*），CI "Guard - reject placeholder
          #    secrets" 会在 apply 前拒绝任何含 CHANGEME 的值，真实密钥不落 Git
          #  - CKV_GHA_7: workflow_dispatch inputs（environment/log_level）是部署运维
          #    选择项，不参与构建产物注入；镜像内容仅来自受保护分支的 push/PR
          skip_check: CKV_K8S_35,CKV_K8S_40,CKV_K8S_43,CKV_SECRET_4,CKV_SECRET_6,CKV_GHA_7

      - name: Detect secrets (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          chmod +x /tmp/gitleaks
          /tmp/gitleaks detect --source . --config gitleaks.toml --no-banner --verbose

      - name: Dependency review (PR 引入的新依赖漏洞)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,0BSD,Unlicense

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true

  # ============================================================================
  # Job 2: 前端测试与构建
  # ============================================================================
  frontend-test:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    # 不再单点依赖 security-scan：预扫描失败不应连锁跳过全部单测/构建，
    # 安全门禁改为在镜像构建/部署前统一收敛（见下方 needs）。
    defaults:
      run:
        working-directory: metaclouds-frontend-vue
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: metaclouds-frontend-vue/package-lock.json

      # ----------------------------------------------------------------------
      # 前端 node_modules 缓存
      # ----------------------------------------------------------------------
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: metaclouds-frontend-vue/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('metaclouds-frontend-vue/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # Vue 项目类型检查：vue-tsc --noEmit（package.json 中 type-check 脚本）
      - name: TypeScript type check
        run: npm run type-check

      # ----------------------------------------------------------------------
      # 前端单元测试（vitest）：仓库已含真实测试（api/http、stores/auth、
      # pages/Login|JobManagement|Dashboard 共 5 文件 31 用例），不再使用
      # passWithNoTests——该 flag 会掩盖"测试文件缺失"的真实回归。
      # 前端单测为阻断项：测试失败时直接中断该 job，不再使用 continue-on-error。
      # ----------------------------------------------------------------------
      - name: Run frontend tests
        run: npm run test

      - name: Build frontend
        run: npm run build
        env:
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'

      # ----------------------------------------------------------------------
      # 前端安全扫描（npm audit）
      # critical 级漏洞阻断 CI（exit 1）；high 级仅警告，依赖升级由 dependabot/人工 PR 处理。
      # ----------------------------------------------------------------------
      - name: npm audit (critical severity, blocking)
        working-directory: metaclouds-frontend-vue
        run: |
          set +e
          npm audit --audit-level=critical > npm-audit-output.txt 2>&1
          AUDIT_RC=$?
          cat npm-audit-output.txt
          if [ "$AUDIT_RC" -ne 0 ]; then
            mkdir -p ../npm-audit-failure && cp npm-audit-output.txt ../npm-audit-failure/
            echo "::error::npm audit failed (rc=$AUDIT_RC) — full output also uploaded as artifact 'npm-audit-report'"
          fi
          exit $AUDIT_RC
      - name: Upload npm audit report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-failure/npm-audit-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: npm audit (high severity, non-blocking warning)
        if: always()
        run: |
          npm audit --audit-level=high || echo "::warning title=npm audit::npm audit found high-severity issues — see logs above; dependency upgrades tracked separately."

      # ----------------------------------------------------------------------
      # 上传前端 dist 构建产物
      # ----------------------------------------------------------------------
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: metaclouds-frontend-vue/dist
          if-no-files-found: warn

  # ============================================================================
  # Job 3: Rust 后端 Docker 镜像构建与推送（唯一主后端）
  # push:true —— 已在 permissions 中授予 packages: write，镜像推送到 GHCR。
  # deploy-k8s 依赖按 GIT_SHA 拉取镜像，关闭推送会导致 ImagePullBackOff。
  # ============================================================================
  docker-build-backend-rust:
    name: Build Rust Backend Docker Image
    needs: [rust-lint-test, frontend-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for rust backend
        id: meta-rust-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.RUST_BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # 钉版本：long SHA tag 供部署阶段唯一引用，避免浮动 main 或短 SHA 歧义
            type=sha,format=long

      - name: Pin base image digests (optional, R6)
        # Variable BASE_IMAGE_DIGESTS 提供时把工作副本 FROM 钉到不可变 digest。
        # 值由联网主机 `bash scripts/pin-base-images.sh --resolve` 生成；未配置则跳过（行为不变）。
        if: vars.BASE_IMAGE_DIGESTS != ''
        run: bash scripts/pin-base-images.sh --apply
        env:
          BASE_IMAGE_DIGESTS: ${{ vars.BASE_IMAGE_DIGESTS }}

      - name: Build Rust backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./metaclouds-backend-rust
          file: metaclouds-backend-rust/Dockerfile
          push: true
          tags: ${{ steps.meta-rust-backend.outputs.tags }}
          labels: ${{ steps.meta-rust-backend.outputs.labels }}
          # 每次 run 换一个值，强制 runtime 的 apk upgrade 层缓存失效（见 Dockerfile）
          build-args: |
            SECURITY_UPDATES_REVISION=${{ github.run_id }}
          cache-from: type=gha,scope=backend-rust
          cache-to: type=gha,mode=max,scope=backend-rust

      - name: Trivy image scan (rust backend)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          # 扫描已推送的运行时镜像而非源码目录：fs 扫描看不到最终镜像里的
          # 系统包/基础镜像层，此前等于把最关键的攻击面留在门禁之外。
          scan-type: 'image'
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.RUST_BACKEND_IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-rust-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results (rust backend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-backend-rust-results.sarif'
        # 扫描失败（发现高危漏洞）时仍要上传报告，便于按 SARIF 定位修复
        if: always()

      # 失败可诊断化（job logs 匿名 403、code-scanning alerts 要认证）：
      # 把 SARIF 同步上传为 artifact，匿名环境拿不到日志时仍可确诊漏洞清单
      - name: Upload Trivy sarif artifact (backend, on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trivy-backend-sarif
          path: trivy-backend-rust-results.sarif
          retention-days: 14

  # ============================================================================
  # Job 4: 前端 Docker 镜像构建与推送
  # ============================================================================
  docker-build-frontend:
    name: Build Frontend Docker Image
    needs: [rust-lint-test, frontend-test, security-scan]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # 钉版本：long SHA tag 供部署阶段唯一引用，避免浮动 main 或短 SHA 歧义
            type=sha,format=long

      - name: Pin base image digests (optional, R6)
        # 同 backend：BASE_IMAGE_DIGESTS 提供时改写工作副本 FROM（不提交）。
        if: vars.BASE_IMAGE_DIGESTS != ''
        run: bash scripts/pin-base-images.sh --apply
        env:
          BASE_IMAGE_DIGESTS: ${{ vars.BASE_IMAGE_DIGESTS }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: metaclouds-frontend-vue
          file: metaclouds-frontend-vue/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          # 每次 run 换一个值，强制 runtime 的 apk upgrade 层缓存失效（见 Dockerfile）
          build-args: |
            SECURITY_UPDATES_REVISION=${{ github.run_id }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Trivy image scan (frontend)
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          scan-type: 'image'
          image-ref: '${{ env.DOCKER_REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results (frontend)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-frontend-results.sarif'
        if: always()

      # 失败可诊断化：同 backend，匿名环境拿不到 job logs / code-scanning 时仍可确诊
      - name: Upload Trivy sarif artifact (frontend, on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trivy-frontend-sarif
          path: trivy-frontend-results.sarif
          retention-days: 14

  # ============================================================================
  # Job 5a: 部署到 Development（统一 GHCR 镜像，P1-1 收敛双路径）
  # 此前该 job 在目标主机 `cargo build --release && systemctl restart`，与 K8s
  # 镜像路径产物不同、且 compose 默认 USE_SQLITE=true 与生产 PG 漂移。现在两条
  # 路径都拉同一 commit 的镜像；凭据/目标地址缺失时直接失败，不再"跳过也算绿"。
  # ============================================================================
  deploy-development:
    name: Deploy to Development
    needs: [docker-build-backend-rust, docker-build-frontend, deploy-prereqs]
    if: needs.deploy-prereqs.outputs.development == 'true' && (github.ref == 'refs/heads/develop' || (github.event.inputs.environment == 'development' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ vars.DEV_BASE_URL }}
    env:
      LOG_LEVEL: DEBUG
      DEV_SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      DEV_HOST: ${{ secrets.DEV_HOST }}
      DEV_USER: ${{ secrets.DEV_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/metaclouds' }}
      BASE_URL: ${{ vars.DEV_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard - deployment prerequisites (single source of truth)
        run: bash scripts/check-deploy-prereqs.sh --target development --strict

      - name: Deploy to Development (immutable image)
        run: |
          printf '%s' "$DEV_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # 目标主机需预置 GHCR 登录凭据与 .env（含 postgresql:// DATABASE_URL）；
          # git pull 只用于取编排文件，后端不再从源码构建。
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$DEV_USER@$DEV_HOST" \
            "cd $DEPLOY_DIR && git pull --ff-only && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose pull backend frontend && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose up -d --no-build backend frontend"
          rm -f /tmp/deploy_key

      - name: Verify Development deployment
        run: bash scripts/verify-deployment.sh "$BASE_URL"

  # ============================================================================
  # Job 5b: 部署到 Staging（统一 GHCR 镜像 + 真实断言，P0-3 / P1-1）
  # ============================================================================
  deploy-staging:
    name: Deploy to Staging
    needs: [docker-build-backend-rust, docker-build-frontend, deploy-prereqs]
    if: needs.deploy-prereqs.outputs.staging == 'true' && (github.ref == 'refs/heads/main' || (github.event.inputs.environment == 'staging' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_BASE_URL }}
    env:
      LOG_LEVEL: INFO
      STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      STAGING_HOST: ${{ secrets.STAGING_HOST }}
      STAGING_USER: ${{ secrets.STAGING_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/metaclouds' }}
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard - deployment prerequisites (single source of truth)
        run: bash scripts/check-deploy-prereqs.sh --target staging --strict

      - name: Deploy to Staging (immutable image)
        run: |
          printf '%s' "$STAGING_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$STAGING_USER@$STAGING_HOST" \
            "cd $DEPLOY_DIR && git pull --ff-only && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose pull backend frontend && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose up -d --no-build backend frontend"
          rm -f /tmp/deploy_key

      - name: Verify Staging deployment
        run: bash scripts/verify-deployment.sh "$BASE_URL"

  # ============================================================================
  # Job 5c: 生产环境审批门
  # ============================================================================
  production-approval:
    name: Production Approval Gate
    needs: [deploy-staging]
    if: github.event.inputs.environment == 'production' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL }}
    steps:
      - name: Approval Gate
        run: echo "Production deployment approved"

  # ============================================================================
  # Job 5d: 部署到 Production（统一 GHCR 镜像 + 真实断言）
  # ============================================================================
  deploy-production:
    name: Deploy to Production
    needs: [production-approval, deploy-prereqs]
    if: needs.deploy-prereqs.outputs.production == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_BASE_URL }}
    env:
      LOG_LEVEL: WARN
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_USER: ${{ secrets.PROD_USER }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR || '/opt/metaclouds' }}
      BASE_URL: ${{ vars.PROD_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Guard - deployment prerequisites (single source of truth)
        run: bash scripts/check-deploy-prereqs.sh --target production --strict

      - name: Deploy to Production (immutable image)
        run: |
          printf '%s' "$PROD_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$PROD_USER@$PROD_HOST" \
            "cd $DEPLOY_DIR && git pull --ff-only && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose pull backend frontend && \
             IMAGE_TAG=sha-${{ github.sha }} USE_SQLITE=false docker compose up -d --no-build backend frontend"
          rm -f /tmp/deploy_key

      - name: Verify Production deployment
        run: bash scripts/verify-deployment.sh "$BASE_URL"

      - name: Record deployment
        run: |
          echo "Deployment verified at $(date) with commit ${{ github.sha }}"

  # ============================================================================
  # Job 6: 部署后综合验证（真实断言，P0-3）
  #
  # 此前 `if: always()` + 占位域名 curl + 只 echo 状态码 = 恒 success；同时
  # needs 依赖三个互斥环境 job（其中两个通常 skipped），等于从未验证任何部署。
  # 现在只在 staging 部署成功后运行，对真实地址做 health/ready + mode 断言，
  # 失败即让流水线变红。地址由仓库变量注入，不再用 example.com 占位。
  # ============================================================================
  verify-deployment:
    name: Comprehensive Deployment Verification
    needs: [deploy-staging]
    if: ${{ needs.deploy-staging.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify endpoints of the deployed build
        run: bash scripts/verify-deployment.sh "$BASE_URL"

  # ============================================================================
  # Job 7: Rust 后端（lint / test / coverage / release）
  # 来源：metaclouds-backend-rust/.github/workflows/ci-rust.yml（子目录 workflow
  #       不被 GitHub Actions 识别，已合并至根目录）
  # ============================================================================
  rust-lint-test:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    # 不再单点依赖 security-scan：预扫描失败不应连锁跳过全部单测/构建，
    # 安全门禁改为在镜像构建/部署前统一收敛（见下方 needs）。
    defaults:
      run:
        working-directory: metaclouds-backend-rust
    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: "true"
      DATABASE_URL: "sqlite::memory:"
      JWT_SECRET: "ci-jwt-secret-at-least-32-characters-long-pad"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            metaclouds-backend-rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('metaclouds-backend-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet

      # cargo audit（RustSec 公告比对 Cargo.lock）
      # 已真实修复（不是豁免，勿回退成 --ignore）：
      #   RUSTSEC-2026-0346..0349 —— rustls <0.23.46 → Cargo.lock 升至 0.23.46；
      #   RUSTSEC-2026-0367/0368/0369/0429 —— zip 3.0.0 → utoipa 6.0.0 /
      #     utoipa-swagger-ui 10.0.2 连带把 build-dep zip 升至 9.5.1（R11 第九轮）。
      #     对照实验：旧 Cargo.lock 去掉 4 条豁免后实测报 4 条漏洞（exit 1），
      #     新 Cargo.lock 同样不加豁免实测 exit 0 —— 是依赖真实升级，非门禁放宽。
      # 显式豁免（剩余 4 条，均有台账与解除条件，禁止新增同类豁免）：
      #   RUSTSEC-2026-0459 —— libsqlite3-sys 0.30.1（bundled SQLite <3.54 未初始化
      #     页缓存内存泄露，CVE-2026-119375）。实际暴露面：AV:L/PR:N/UI:P，需要
      #     进程打开攻击者构造的 db+wal 文件对；后端只打开自建库、不打开外部提交
      #     的 SQLite 文件，生产走 Postgres（USE_SQLITE=false），攻击面为零。
      #     sqlx 0.9.0 也仅用 libsqlite3-sys ^0.37（< patched 0.39），当前无
      #     免重建的升级路径。解除：sqlx 升级到 libsqlite3-sys >= 0.39 的版本。
      #   RUSTSEC-2023-0071 —— rsa 0.9.10（Marvin Attack，timing 私钥恢复）。
      #     仅被 sqlx-mysql 依赖（MySQL caching_sha2 auth）；本项目双驱动为
      #     SQLite/Postgres，不连接 MySQL，代码路径不可达。sqlx 0.8 锁 rsa ^0.9，
      #     无免重建升级路径。
      #   RUSTSEC-2024-0421 —— idna 0.5.0（Punycode 解析歧义，接受解码后无
      #     non-ASCII 的标签）。仅被 validator 0.18.1 用于 email/域名校验，
      #     影响是校验宽松而非内存安全；validator 升级轮次处理。
      #   RUSTSEC-2024-0437 —— protobuf 2.28.0（解析恶意 wire format 无限递归
      #     crash）。仅被 prometheus 0.13.4 依赖，本项目只用文本格式暴露
      #     /metrics，不解析外部 protobuf 输入；prometheus 0.13 锁 protobuf ^2。
      # 台账：docs/system-fixes-2026-11-09.md R11（含每条的解除条件与攻击面分析）。
      - name: cargo audit (Rust CVE scan)
        run: |
          set +e
          cargo audit \
            --ignore RUSTSEC-2026-0459 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0421 \
            --ignore RUSTSEC-2024-0437 > audit-output.txt 2>&1
          AUDIT_RC=$?
          cat audit-output.txt
          if [ "$AUDIT_RC" -ne 0 ]; then
            # 失败时保留完整报告为 artifact，便于无日志权限的环境定位具体 RUSTSEC ID
            mkdir -p audit-failure && cp audit-output.txt audit-failure/
            echo "::error::cargo audit failed (rc=$AUDIT_RC) — full report also uploaded as artifact 'cargo-audit-report'"
          fi
          exit $AUDIT_RC
      - name: Upload cargo audit report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: metaclouds-backend-rust/audit-failure/audit-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: cargo test
        run: cargo test --all-features

      - name: cargo build (debug)
        run: cargo build

  # Postgres 双驱动冒烟测试：postgres:16 service 容器 + --ignored 测试
  #（验证 JSONB / TIMESTAMPTZ / 软删除 / UPSERT 等 Postgres 方言关键路径）
  rust-test-postgres:
    name: Rust Postgres Dual-Driver Tests
    runs-on: ubuntu-latest
    # 不再单点依赖 security-scan：预扫描失败不应连锁跳过全部单测/构建，
    # 安全门禁改为在镜像构建/部署前统一收敛（见下方 needs）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: metaclouds-backend-rust
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      USE_SQLITE: "false"
      JWT_SECRET: "ci-jwt-secret-at-least-32-characters-long-pad"
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            metaclouds-backend-rust/target
          key: ${{ runner.os }}-cargo-pg-${{ hashFiles('metaclouds-backend-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pg-

      - name: Run Postgres smoke tests (--ignored)
        run: cargo test --test postgres_smoke_test -- --ignored --nocapture

      - name: Run Postgres integration tests (migrations + JSONB codec + CRUD)
        run: cargo test --test postgres_integration_test -- --ignored --nocapture

  # 覆盖率统计：初期只统计、不阻塞 PR，输出摘要与产物
  rust-coverage:
    name: Rust Coverage
    runs-on: ubuntu-latest
    needs: rust-lint-test
    continue-on-error: true
    defaults:
      run:
        working-directory: metaclouds-backend-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            metaclouds-backend-rust/target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('metaclouds-backend-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-coverage-

      - name: Install cargo-llvm-cov
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --version
          rustc --version
          rustup component list | grep llvm || true

      - name: Run coverage, print summary and write lcov.info
        run: |
          set -x
          rustup component list | grep -i llvm || true
          which llvm-cov || ls -la ~/.cargo/bin | grep -i llvm || true
          cargo llvm-cov --version 2>&1 || true
          cargo llvm-cov --all-features --summary 2>&1 | tee coverage-summary.log
          cargo llvm-cov --all-features --lcov --output-path lcov.info 2>&1 | tee coverage-run.log
      - name: Upload coverage debug logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-debug
          path: |
            coverage-summary.log
            coverage-run.log

      - name: Upload coverage (LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: metaclouds-backend-rust/lcov.info

  # Release 构建：验证优化产物可正常编译
  rust-release-build:
    name: Rust Release Build
    runs-on: ubuntu-latest
    # 不再单点依赖 security-scan：预扫描失败不应连锁跳过全部单测/构建，
    # 安全门禁改为在镜像构建/部署前统一收敛（见下方 needs）。
    defaults:
      run:
        working-directory: metaclouds-backend-rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            metaclouds-backend-rust/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('metaclouds-backend-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: cargo build --release
        run: cargo build --release

      # 上传 Rust release 二进制产物
      - name: Upload Rust backend binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-rust-binary
          path: metaclouds-backend-rust/target/release/metaclouds-backend-rust
          if-no-files-found: warn

  # ============================================================================
  # Job 8: K8s 清单结构校验（YAML 可解析 + 必需 metadata/namespace）
  # 镜像层级命名 + kustomize 引用完整性（防 ImagePullBackOff / 引用丢失）
  # 由仓库内 verify-k8s-rules.js 统一把关（本 job 后续步骤运行），此处只做结构校验。
  # ============================================================================
  validate-k8s:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    # 不再单点依赖 security-scan：预扫描失败不应连锁跳过全部单测/构建，
    # 安全门禁改为在镜像构建/部署前统一收敛（见下方 needs）。
    steps:
      - uses: actions/checkout@v4

      - name: Validate K8s manifests (YAML structure + required metadata/namespace)
        run: |
          python3 -m pip install --quiet --user pyyaml 2>/dev/null || true
          python3 - <<'PYEOF'
          import os, sys
          try:
              import yaml
          except ImportError:
              print("PyYAML unavailable; skipping validation")
              sys.exit(0)

          K8S_DIR = "metaclouds-backend-rust/k8s"
          errors = []

          # 1) 每个清单文件 YAML 可解析且含 kind/metadata/namespace
          manifests = {}
          for fn in sorted(os.listdir(K8S_DIR)):
              if not fn.endswith((".yaml", ".yml")):
                  continue
              path = os.path.join(K8S_DIR, fn)
              try:
                  docs = list(yaml.safe_load_all(open(path, encoding="utf-8")))
              except Exception as e:
                  errors.append(f"{fn}: YAML parse error: {e}")
                  continue
              for i, doc in enumerate(docs):
                  if doc is None:
                      continue
                  kind = doc.get("kind")
                  # Kustomization 按 v5 规范无 metadata（metadata.name 已弃用），
                  # 只需校验 kind；其余资源必须含 metadata（及 namespace）
                  if kind == "Kustomization":
                      manifests.setdefault(fn, []).append(kind)
                      continue
                  if "metadata" not in doc:
                      errors.append(f"{fn}[{i}]: missing metadata")
                      continue
                  name = doc["metadata"].get("name", "")
                  manifests.setdefault(fn, []).append(kind)
                  if kind != "Namespace" and not doc["metadata"].get("namespace"):
                      errors.append(f"{fn}[{i}] {kind}/{name}: missing namespace")

          # 注：镜像层级命名 + kustomize 引用完整性（原 rules 2&3）已统一交由
          # 仓库内 verify-k8s-rules.js 把关（本 job 后续步骤运行），此处仅做结构校验，
          # 避免双源漂移导致"改了一处另一处仍放过"的回归。

          if errors:
              print("K8s manifest validation FAILED:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          total = sum(len(v) for v in manifests.values())
          print(f"K8s manifest validation PASSED: {total} resources in {len(manifests)} files")
          PYEOF

      # ----------------------------------------------------------------------
      # 运行期前置静态把关（TEST-ONLY 脚本不落真实凭据，仅 CI 内客户端 dry-run 校验）
      # 下列脚本在目标集群落地"运行期前置"（PostgreSQL 数据面 + 测试 secret 注入），
      # 此处用客户端 dry-run 在流水线上静态把关：清单合法、脚本可解析、key 集完整，
      # 全部不依赖真实集群即可执行（verify-k8s-rules.js 亦为仓库内既有规则校验器）。
      # ----------------------------------------------------------------------
      - name: Set up Node.js (for verify-k8s-rules.js)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run verify-k8s-rules.js (image naming + kustomize refs)
        run: node verify-k8s-rules.js

      - name: Install kubectl client (for scripts dry-run; no cluster/kubeconfig needed)
        run: |
          curl -sSfL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          kubectl version --client

      - name: Lint deployment scripts (bash -n syntax)
        run: |
          bash -n scripts/provision-test-secret.sh
          bash -n scripts/deploy-cluster.sh
          echo "bash syntax check PASSED for scripts/*.sh"

      - name: Static gate - provision-test-secret.sh --check-keys
        run: bash scripts/provision-test-secret.sh --check-keys

      - name: Static gate - provision-test-secret.sh --dry-run (client-side manifest gen)
        run: bash scripts/provision-test-secret.sh --dry-run

      - name: Static gate - deploy-cluster.sh --dry-run (full kustomize build, client-side)
        run: bash scripts/deploy-cluster.sh --dry-run

  # ============================================================================
  # Job 9: K8s 真实部署（kustomize apply + set image 注入 GIT_SHA）
  # 依赖：deploy-prereqs 放行 k8s 目标 + 镜像构建完成 + 清单校验通过。
  # 注意：02-secret.yaml 仓库内是 CHANGEME 占位模板，apply 前必须由
  #       render-k8s-secret.sh 从 CI secrets 渲染真实 Secret 工作副本，
  #       否则 Guard 必然失败，且 apply -k 会把集群里的真实 Secret 覆盖回占位值。
  # ============================================================================
  deploy-k8s:
    name: Deploy to Kubernetes
    needs: [docker-build-backend-rust, docker-build-frontend, validate-k8s, deploy-prereqs]
    if: needs.deploy-prereqs.outputs.k8s == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: k8s
      url: ${{ vars.K8S_BASE_URL }}
    env:
      K8S_ENABLED: ${{ secrets.KUBE_CONFIG != '' }}
      K8S_NAMESPACE: metaclouds
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
      K8S_JWT_SECRET: ${{ secrets.K8S_JWT_SECRET }}
      K8S_DATABASE_URL: ${{ secrets.K8S_DATABASE_URL }}
      K8S_REDIS_PASSWORD: ${{ secrets.K8S_REDIS_PASSWORD }}
      K8S_DEFAULT_ADMIN_PASSWORD: ${{ secrets.K8S_DEFAULT_ADMIN_PASSWORD }}
      K8S_POSTGRES_PASSWORD: ${{ secrets.K8S_POSTGRES_PASSWORD }}
      K8S_PROTECTED_ENDPOINTS_TOKEN: ${{ secrets.K8S_PROTECTED_ENDPOINTS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl + kustomize
        run: |
          curl -sSfL "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /usr/local/bin/kubectl
          chmod +x /usr/local/bin/kubectl
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" -o /tmp/kustomize.tgz
          tar -xzf /tmp/kustomize.tgz -C /usr/local/bin kustomize
          kubectl version --client && kustomize version

      - name: Configure kubeconfig
        if: env.K8S_ENABLED == 'true'
        run: |
          # 从 env 读取而非把 secret 直接插值进 shell 源码：避免引号/换行破坏命令，
          # 也避免 kubeconfig 内容出现在渲染后的脚本里。
          printf '%s' "$KUBE_CONFIG" | base64 -d > /tmp/kubeconfig
          chmod 600 /tmp/kubeconfig
          export KUBECONFIG=/tmp/kubeconfig
          # 安全：禁止打印 kubeconfig 内容。`kubectl config view --minify -o yaml`
          # 会连同集群 CA 与 user token / client-certificate-data 一起输出到
          # 公开可见的 CI 日志，等同于泄露集群凭据。只打印非敏感的定位信息。
          echo "kubeconfig loaded (credentials intentionally not printed)"
          kubectl config current-context || true
          kubectl config get-contexts --no-headers || true

      # 占位模板死结：仓库里的 02-secret.yaml 恒含 CHANGEME；Guard 解析它会
      # 100% 拒绝，而 kustomize build 又会把它 apply 进集群覆盖真实凭据。
      # 这里先渲染真实 Secret 的工作副本（只存在于 runner checkout，不提交），
      # 后续 Guard 校验渲染结果、kustomize build 拿到真实值。
      - name: Render real K8s Secret from CI secrets
        if: env.K8S_ENABLED == 'true'
        run: bash scripts/render-k8s-secret.sh --output metaclouds-backend-rust/k8s/02-secret.yaml

      - name: Guard - deployment prerequisites (single source of truth)
        run: bash scripts/check-deploy-prereqs.sh --target k8s --strict

      # 校验「渲染后」的 Secret，而不是仓库里的占位模板。
      # 旧实现的问题：① import yaml 依赖 runner 预装 PyYAML（本 job 从未安装）；
      # ② 错误分支里的 Python 字符串存在未转义的嵌套引号，本身是语法错误；
      # ③ 把解码后的凭据明文打到公开日志；④ 恒含 CHANGEME 的模板永远触发失败。
      # 现在改为纯标准库逐行解析，只报 key 名，绝不回显值。
      - name: Guard - verify rendered Secret has real credentials
        if: env.K8S_ENABLED == 'true'
        run: |
          python3 - <<'PY'
          import base64, re, sys

          path = "metaclouds-backend-rust/k8s/02-secret.yaml"
          required = {
              "jwt-secret", "database-url", "redis-password",
              "default-admin-password", "postgres-password",
              "protected-endpoints-token",
          }
          data, in_data = {}, False
          for line in open(path, encoding="utf-8"):
              if line.startswith("data:"):
                  in_data = True
                  continue
              if not in_data:
                  continue
              m = re.match(r"^  ([a-z0-9-]+):\s*(\S+)\s*$", line)
              if m:
                  data[m.group(1)] = m.group(2)
              elif line.strip() and not line.startswith((" ", "#")):
                  in_data = False

          missing = sorted(required - set(data))
          if missing:
              print("::error::rendered Secret is missing required keys: %s" % ", ".join(missing))
              sys.exit(1)

          bad = []
          for key in sorted(data):
              try:
                  plain = base64.b64decode(data[key]).decode("utf-8", "replace")
              except Exception:
                  bad.append("%s (base64 decode failed)" % key)
                  continue
              if not plain.strip() or "CHANGEME" in plain or "placeholder" in plain.lower():
                  bad.append(key)  # 只报 key 名，不回显明文

          if bad:
              print("::error::Refusing to deploy: placeholder/empty credentials in rendered Secret")
              for key in bad:
                  print("::error::  - %s (value intentionally not printed)" % key)
              print("::error::Inject real CI secrets and re-run scripts/render-k8s-secret.sh")
              sys.exit(1)

          print("rendered Secret verified: %d keys, no placeholders" % len(data))
          PY

      # P1-5：后端多副本不等于系统高可用——内置 PG 仍是单副本。
      # 默认发出显式告警；把仓库变量 REQUIRE_PG_HA 设为 true 可升级为硬门禁，
      # 强制生产切换到托管 PG / CloudNativePG 后再允许部署。
      - name: Guard - database HA in production
        if: env.K8S_ENABLED == 'true'
        env:
          REQUIRE_PG_HA: ${{ vars.REQUIRE_PG_HA }}
        run: |
          if grep -q 'metaclouds.io/production-ha: "false"' metaclouds-backend-rust/k8s/17-postgresql.yaml; then
            MSG="built-in PostgreSQL is single-replica; backend 3 replicas + HPA + PDB do NOT make the system HA. Use managed PG / CloudNativePG and update DATABASE_URL."
            if [ "$REQUIRE_PG_HA" = "true" ]; then
              echo "::error::$MSG"
              exit 1
            fi
            echo "::warning::$MSG (set repo variable REQUIRE_PG_HA=true to block production deploys)"
          fi

      # P1-2：kustomization 默认 newTag: main 是浮动分支 tag。部署前用 kustomize
      # 把镜像钉到本次 commit 的不可变 sha tag（与 metadata-action 的
      # type=sha,format=long 一致），避免 apply 后再 kubectl set image 造成
      # 清单漂移，以及此前 set image 用裸 <full-sha>（根本不存在的 tag）
      # 导致的 ImagePullBackOff。
      - name: Pin image tags to commit SHA
        if: env.K8S_ENABLED == 'true'
        working-directory: metaclouds-backend-rust/k8s
        run: |
          kustomize edit set image \
            ghcr.io/customizedvalidation/yunchuang/backend-rust=ghcr.io/customizedvalidation/yunchuang/backend-rust:sha-${{ github.sha }}
          kustomize edit set image \
            ghcr.io/customizedvalidation/yunchuang/frontend=ghcr.io/customizedvalidation/yunchuang/frontend:sha-${{ github.sha }}
          echo "Pinned images:" && grep -A5 '^images:' kustomization.yaml

      - name: Apply manifests (kustomize)
        if: env.K8S_ENABLED == 'true'
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          # 先应用命名空间，其余资源等命名空间就绪
          kubectl apply -f metaclouds-backend-rust/k8s/00-namespace.yaml
          kustomize build metaclouds-backend-rust/k8s | kubectl apply -f -
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/metaclouds-backend --timeout=300s
          kubectl -n ${{ env.K8S_NAMESPACE }} rollout status deployment/metaclouds-frontend --timeout=120s

      - name: Assert deployed images are SHA-pinned
        if: env.K8S_ENABLED == 'true'
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          EXPECTED="sha-${{ github.sha }}"
          for d in metaclouds-backend metaclouds-frontend; do
            ACTUAL=$(kubectl -n "${{ env.K8S_NAMESPACE }}" get deploy "$d" \
              -o jsonpath='{.spec.template.spec.containers[*].image}')
            echo "$d -> $ACTUAL"
            case "$ACTUAL" in
              *"$EXPECTED"*) ;;
              *) echo "::error::$d is not running $EXPECTED"; exit 1 ;;
            esac
          done

      - name: Verify K8s deployment
        if: env.K8S_ENABLED == 'true'
        run: |
          export KUBECONFIG=/tmp/kubeconfig
          echo "=== Pods ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get pods -o wide
          echo "=== Services ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get svc
          echo "=== Ingress ==="
          kubectl -n ${{ env.K8S_NAMESPACE }} get ingress
          echo "=== Health via port-forward ==="
          # 真实断言：port-forward 后必须拿到 health/ready 200，否则部署失败。
          # 此前 `curl ... || echo Warning` 永远成功，掩盖了集群根本没起来的事实。
          kubectl -n ${{ env.K8S_NAMESPACE }} port-forward svc/metaclouds-backend 18080:8000 &
          PF_PID=$!
          OK=0
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 5 http://localhost:18080/health/ready >/dev/null; then
              echo "health/ready OK (attempt $i)"
              OK=1
              break
            fi
            sleep 2
          done
          kill $PF_PID 2>/dev/null || true
          if [ "$OK" -ne 1 ]; then
            echo "::error::K8s health/ready check failed after rollout"
            exit 1
          fi

      # 二次兜底：preflight 未放行 k8s 时整个 job 已 skipped，正常不会走到这里。
      # 若有人改动 workflow 绕过 preflight 而 KUBE_CONFIG 又缺失，仍拒绝把跳过的
      # 部署记为成功。
      - name: Refuse to report a skipped deployment as successful
        if: env.K8S_ENABLED != 'true'
        run: |
          echo "::error::KUBE_CONFIG secret not configured; refusing to mark a skipped K8s deployment as successful."
          echo "Configure repo secret KUBE_CONFIG (base64 kubeconfig) and enable k8s in DEPLOY_TARGETS."
          exit 1